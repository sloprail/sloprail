doc: "One unit of a changeset judged, and given a verdict, on its own."
fields:
  - name: id
    type: string
    doc: "The subject's name in results."
    constraint_expr: "unique within a changeset, non-empty"
  - name: files
    type: string[]
    doc: "The selected files the subject is about."
    constraint_expr: "each is in the changeset's files"
  - name: fingerprint
    type: string
    doc: "What else the verdict depends on beyond the files."
    constraint_expr: "required when files is empty"
  - name: batch
    type: string
    doc: "The batch the subject is handed to the rule's checks in, together with the other subjects of that batch; absent for a subject handed alone."
    constraint_expr: "non-empty when present"
