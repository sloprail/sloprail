# A writing RULE must be traceable to a human ask — the RULE SET's own
# protection, the same role task-body-is-human-authored plays for a task's
# ask. Without it, an agent could invent a rule nobody asked for and have it
# silently start gating every future unit.
#
# GROUNDING RIDES ON THE COMMIT, NOT IN THE FILE. Every commit that changes a
# RULE.md / CONSTRAINT.md carries `Sloprail-Cites-User: <exact quote>` trailers
# (`git commit -m '...' -m 'Sloprail-Cites-User: <quote>'`), and the session
# resolves each quote against its own transcripts into `changeset.citations`
# before any check runs. The rule file itself stores only the derived rule text —
# no `[quote](/abs/session.jsonl:N)` link, which would not resolve on any other
# machine. (Rules written before this carry such links; they are NOT forbidden
# and are simply not read — see the plugin README.)
#
# THREE stages, cheapest first:
#   0. REQUIRE (citation, user pool): the engine refuses a changeset whose
#      commits carry no citation that resolves to the user's own words, before
#      any check runs.
#   1. SCRIPT (check-rule.sh): the frontmatter satisfies rule.cue and the body
#      is not empty.
#   2. PREPARE + JUDGE (resolve-cited-rule-quotes.sh + judge-rule-body.md.j2):
#      the rule must correspond to the cited words and hold THAT AND NOTHING
#      ELSE — no invented scope, threshold, exception or rationale the user
#      never stated. `require` proves the quote EXISTS; the judge decides
#      whether it actually GROUNDS the change.
#
# An earlier version of this guard also checked that a rule's `script:` field
# named a script capable of refusing. That check is GONE along with `script:`
# itself — there is no more script-rule mechanism (see
# unit-satisfies-rules/file-guard.yaml's header): every rule is a judge rule
# now, so an untraceable, vacuous or self-contradicting rule fails stage 2.
#
# THE COMMITTED CHANGESET. The gate of the same name (../../gate/
# content-rule-is-grounded) refuses an ungrounded or invented rule before it
# lands; this judges the rules in the commits since it last passed, the
# backstop. A rule's base does not move until it passes, so the range
# accumulates its commits and their citations: the requirement is met by any
# resolved user citation in the range, and the judge decides whether the cited
# words ground everything the range changed.
#
# match: EITHER rule location — project-wide RULE.md or topic-scoped
# CONSTRAINT.md, the same two paths rules-lib.sh collects from.
match: path matches "^\\.sloprail/content-rules/[^/]+/RULE\\.md$" or path matches "^memories/topics/[^/]+/constraints/[^/]+/CONSTRAINT\\.md$"

# deletions: left at the default (skip). Deleting a rule removes a constraint
# rather than inventing one, so it is not this guard's business.

# UNCONDITIONAL: the range must cite the user's own words.
require:
  - citation: {source_types: [user]}
checks:
  # Stage 1 — deterministic, fail-closed. Refuses with `{"reason": "..."}` on
  # stdout.
  - script: ./check-rule.sh

  # Stage 2 — reached only because require and stage 1 passed. model: size-md
  # (engine default judge modelset); no explicit timeout — it runs under the
  # engine's own default (internal/dispatch/exec.go's defaultCheckTimeout).
  # allowed_tools: [Read] — the cited quotes and the body are both already IN
  # the prompt; Read lets the judge open a cited transcript line for its
  # surrounding context, matching task-body-is-human-authored's grant.
  - prepare: ./resolve-cited-rule-quotes.sh
    judge: ./judge-rule-body.md.j2
    model: size-md
    allowed_tools: [Read]
