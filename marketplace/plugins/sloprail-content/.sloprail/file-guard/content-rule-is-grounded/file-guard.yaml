# A writing RULE must be traceable to a human ask — the RULE SET's own
# protection, the same role task-body-is-human-authored plays for a task's
# ask. Without it, an agent could invent a rule nobody asked for and have it
# silently start gating every future unit.
#
# TWO checks, cheap first — the SAME script+judge shape
# task-body-is-human-authored uses, applied to a rule's body instead of a
# task's:
#   1. SCRIPT (check-rule.sh): the body must carry a [quote](jsonl) link
#      whose quote GROUNDS via cite to the user's own words. No citation, or
#      one that does not ground, is refused HERE — deterministically, before
#      the judge.
#   2. PREPARE + JUDGE (resolve-cited-rule-quotes.sh + judge-rule-body.md.j2):
#      the rule must correspond to the cited words and hold THAT AND NOTHING
#      ELSE — no invented scope, threshold, exception or rationale the user
#      never stated.
#
# An earlier version of this guard also checked that a rule's `script:` field
# named a script capable of refusing. That check is GONE along with `script:`
# itself — there is no more script-rule mechanism (see
# unit-satisfies-rules/file-guard.yaml's header): every rule is a judge rule
# now, so "is this rule capable of refusing" is exactly the SAME question
# task-body-is-human-authored's own judge already answers for a task body —
# an untraceable, vacuous or self-contradicting rule fails stage 2 here.
#
# match: EITHER rule location — project-wide RULE.md or topic-scoped
# CONSTRAINT.md, the same two paths rules-lib.sh collects from.
match: path matches "^\\.sloprail/content-rules/[^/]+/RULE\\.md$" or path matches "^memories/topics/[^/]+/constraints/[^/]+/CONSTRAINT\\.md$"

# PREVENTIVE: true — an ungrounded or invented rule should never land in the
# first place; refusing it after the fact would mean it already had a chance
# to gate a unit write before being caught. Mirrors
# task-body-is-human-authored's own preventive binding for the identical
# reason (protecting the oracle, not an artifact).
preventive: true

checks:
  # Stage 1 — deterministic, fail-closed. Refuses with `{"reason": "..."}` on
  # stdout.
  - script: ./check-rule.sh

  # Stage 2 — reached only because stage 1 passed. model: size-md (engine
  # default judge modelset); no explicit timeout — it runs under the engine's
  # own default (internal/dispatch/exec.go's defaultCheckTimeout).
  # allowed_tools: [Read] — the
  # cited messages and the body are both already IN the prompt; Read is the
  # one conservative grant, matching task-body-is-human-authored.
  - prepare: ./resolve-cited-rule-quotes.sh
    judge: ./judge-rule-body.md.j2
    model: size-md
    allowed_tools: [Read]
