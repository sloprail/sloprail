# sloprail-content's own piece of the project-wide structure gate — the
# folders this plugin owns, and exactly which shapes may be written inside
# them. Combines with the consumer project's own structure.yaml (if any) and
# every other installed plugin's: inside this plugin's scope, THIS file alone
# decides what may be written (the project's allow does not widen it; the
# project's deny still vetoes) — outside it, this file has no say at all. See
# marketplace/plugins/sloprail/skills/authoring-guardrails/structure-gate.md.
#
# scope: glob-only, each entry a FOLDER (ends in "/"). Two folders this
# plugin owns:
#   memories/topics/            content units and their topic-scoped rules
#                                (the pre-existing document-topic shape,
#                                extended by this plugin's UNIT.md/
#                                CONSTRAINT.md taxonomy fields — no new
#                                folder shape, so this scope is exactly the
#                                one document-topic already claims)
#   .sloprail/content-rules/    the NEW location this plugin adds: project-
#                                wide rules, selected by applies_to rather
#                                than by topic, plus their scripts and any
#                                banned-phrase list
scope:
  - glob: "memories/topics/"
  - glob: ".sloprail/content-rules/"

allow:
  # TOPIC.md — the topic's own thesis/status file (document-topic's shape,
  # unchanged by this plugin).
  - regex: '^memories/topics/[0-9]{8}_[a-z0-9-]+/TOPIC\.md$'

  # A unit's frontmatter (UNIT.md) and its numbered content files
  # (01_raw.md, 02_draft.md, 03_research_*.md, …) — the existing document-topic
  # shape this plugin's unit-satisfies-rules and unit-publish-approved match.
  - regex: '^memories/topics/[0-9]{8}_[a-z0-9-]+/units/[0-9]{2}_[a-z0-9-]+/(UNIT|[0-9]{2}_[a-z0-9_-]+)\.md$'

  # A topic-scoped rule (the migrated constraints/ location — see the
  # README's migration note). Same path the pre-existing
  # unit-satisfies-constraints guard used.
  - regex: '^memories/topics/[0-9]{8}_[a-z0-9-]+/constraints/[0-9]{2}_[a-z0-9-]+/CONSTRAINT\.md$'

  # Distribution ideas — unrelated to this plugin's own checks, but part of
  # the SAME topic shape and listed so this piece does not narrow what
  # document-topic already allows within the scope it claims.
  - regex: '^memories/topics/[0-9]{8}_[a-z0-9-]+/distribution/[0-9]{2}_[a-z0-9_-]+\.md$'

  # A project-wide rule (RULE.md) — the NEW location this plugin adds,
  # selected by applies_to rather than by topic.
  - regex: '^\.sloprail/content-rules/[0-9]{2}_[a-z0-9-]+/RULE\.md$'

  # A project-local script rule's script — the extension point
  # .sloprail/scripts/README.md documents (script.name resolved here when
  # not one of this plugin's own shipped scripts).
  - regex: '^\.sloprail/content-rules/scripts/[a-z0-9_-]+\.sh$'

  # A project-supplied banned-phrase (or similar) list file a banned-phrases
  # script rule's args names — free-form filename, so this is deliberately
  # permissive within content-rules/ rather than pinned to one name.
  - regex: '^\.sloprail/content-rules/[a-z0-9_.-]+\.(txt|list)$'
