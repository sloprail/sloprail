# rule-tests-pass: when a rule or its cases change, the sr-test cases of that rule must pass, and
# a rule the change adds or edits must have a case. A rule change that breaks a case, or a new rule nobody
# proves fires, is refused here, not discovered later. The argument lives in README.md.
#
# match: any file of a rule or of its cases, at any depth (the root project's `.sloprail/` and a nested plugin's):
#   .sloprail/<gate|file-guard|context>/<rule>/...        (the rule's files and, under tests/, its cases)
#   .sloprail/file-guard/structure.yaml                   (the structure gate; its cases are structure.tests/)
# Every selected file belongs to a rule, so every one is named by a subject. A file of no rule (config.yaml) is
# no reason to run a rule's cases.
# deletions: include, so deleting a rule's last case (or a rule) is seen: the deleted case is then not run, and
# the rule that lost its case is refused.
deletions: include
match: 'path matches "(^|/)[.]sloprail/((gate|file-guard|context)/[^/]+/.|file-guard/structure[.]yaml$)"'

# One subject per RULE the change touches (a changed case, or a changed file of the rule), each cached on its
# own and run alone (`sr-test run . --rule <nature>/<rule>`), as rule-tests-rigorous does: a repo with many
# rules is many small runs that stay under the check timeout, not one long run that times out under load. The
# fingerprint is the rule's own files, ALL its cases and the plugin's manifest, read from SR_TREE.
subjects: ./subjects.sh

checks:
  # Script only: running cases is deterministic and asks no model. Per rule it runs `sr-test run . --rule` over
  # the rule's cases, then `sr-test doctor` for the rule when the change added or edited it.
  - script: ./check.sh
