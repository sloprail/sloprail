# rule-tests-rigorous: the sr-test cases of a rule, taken together, must prove that rule, not decorate it. A
# test suite that passes whatever the rule does is the slop this plugin exists to stop, one layer down: it
# sits in the project looking like coverage and checks nothing. The argument lives in README.md.
#
# The subject is a RULE, not a case: the rule is what a suite proves, and the refusal may sit in one case
# while its permitted neighbour sits in another. A scenario is the rule's property, not a case's.
#
# match: any file of a rule or of its cases, at any depth of nesting (a plugin's own `.sloprail/` too):
#   .sloprail/<gate|file-guard|context>/<rule>/...        (the rule's files and, under tests/, its cases)
#   .sloprail/file-guard/structure.yaml                   (the structure gate; its cases are structure.tests/)
# An expression, not a glob, so the root project's `.sloprail/` matches as well as a nested one. A file
# straight under `tests/` is no case and subjects.sh skips it.
match: 'path matches "(^|/)[.]sloprail/((gate|file-guard|context)/[^/]+/.|file-guard/structure[.]yaml$)"'

# One subject per rule touched by the change (a changed case, or a changed file of the rule), each cached on
# its own; a rule with no case standing is a subject with nothing to judge and passes. A deleted case is not a
# changed file, so it is no reason to judge; the cases that remain are judged when the rule's other files
# changed. The fingerprint carries what the
# verdict reads beside the changed files: the rule's own files and ALL its case folders (read from SR_TREE), so
# editing any case, or the rule, judges that rule once.
subjects: ./subjects.sh

checks:
  # The deterministic floor, per case, over every case of the rule: shebang, an event of the owning rule
  # asserted (its nature's kind, its name), reasons asserted, no vacuous assertion, no fixed-answer mock judge.
  # It reads the committed cases from SR_TREE; any case failing it refuses the rule, naming the case.
  - script: ./check-case.sh

  # The reasoning above the floor, ONE call per rule: across all its cases, is there a refusal for the rule's
  # own reason AND a permitted neighbour at its boundary, a recovery, mocked judges that decide from their
  # input. It lists every gap in one verdict. prepare.sh hands the judge an index of paths (the rule's files
  # and every case's files), which the judge opens with Read; only the rule's name and nature are inline.
  - prepare: ./prepare.sh
    judge: ./judge.md.j2
    model: size-md
    allowed_tools: [Read]
