# The project's structure gate (allow/deny — the one file governing where
# writes may even land) is documented in structure-gate.md — the page that
# shows deny-by-default, the plugin `scope` half a project's own file never
# declares, and the ownership-conflict rule when two plugins' scopes overlap.
# Measured in the onboarding eval: agents routinely wrote too-narrow structures
# (missing .sloprail/** itself, locking themselves out of their own rules, or
# missing the file they were about to write next) and discovered the gap only
# by being refused, one write at a time. See read-script-checks-doc/
# file-guard.yaml for the shared argument for why `require: [{skill, files}]`
# is the right mechanism here.
match: path matches "^\\.sloprail/file-guard/structure\\.ya?ml$"

preventive: true

require:
  - skill: authoring-guardrails
    files: [structure-gate.md]
