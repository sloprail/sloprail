# Commits leave the machine at `git push`, and a pull request merges what was pushed. This
# gate refuses an agent's push until every commit it would send passes the file-guards:
# for each ref the push would update it runs, in the folder the push runs in,
#
#   sr-checks verify --base <merge-base(<remote>/<default branch>, sha)> --head <sha>
#
# which is deterministic (asks no model, writes nothing) and reads the verdicts that
# `sr-checks run` stored on the sloprail/checks branch. A red verify names the exact
# `sr-checks run --base ... --head ...` to judge the range, then push again.
#
# What a push would update is asked of git itself (`git push --dry-run --porcelain` with the
# same global options and arguments), so every remote, refspec, --all/--tags/--mirror and
# default-push form reads the way git reads it. It fails closed: a push whose refs, folder or
# default branch cannot be resolved is refused, as is a push in the same line as a command
# that moves refs first (the gate runs before the line, so it would judge the wrong commits).
# Pushing the results branch sloprail/checks is refused here too: only `sr-checks run`
# writes it.
#
# A folder, remote or refspec the command line spells with a variable the line did not assign to a
# literal, a `$(...)` or a `~` is refused too, with a reason telling the agent to write it literally
# (`git -C <literal dir> push <remote> <ref>`). `D=/x; git -C $D push` and `D=/x && cd $D && git push`
# are read as `/x`; anything else the gate cannot resolve is never judged as the hook's own repository.
#
# The matcher also fires on any `git` invocation with a gap (`.gaps`: a word the engine could not
# resolve among its options or where the subcommand stands, e.g. `git $X`, `git "$(echo push)"`),
# and the script refuses it, fail closed, telling the agent to use the literal subcommand.
#
# Limit: this gate sees the command line the agent runs, not the commands inside a script it
# runs (`sh ship.sh` that pushes). CI verify is the backstop for those.
#
# Ships off. The user said: "Probably we just need to disable this prepush by default." A project opts
# in with `enabled: [sloprail/gate/verify-before-push]` in .sloprail/config.yaml. CI's required
# `sr-checks verify` is the guarantee; run `sr-checks run` before a PR is ready.
enabled: false
on:
  - event: PreCommandInvoke
    match: >-
      any(event.invocations, .bin == "git" and (.gitGapEarly or any(.argv, # == "push")))
checks:
  - script: ./verify.sh
