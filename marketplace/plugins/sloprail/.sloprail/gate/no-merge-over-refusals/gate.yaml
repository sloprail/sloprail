# Landing work past an unresolved refusal is never legitimate: the refusal says the work
# is wrong, and landing it puts it where the rule can no longer hold it. Neither is landing
# a tip this session (or one of its sub-agents) recorded that no rule has passed yet: the
# hint tells the agent to END ITS TURN so Stop judges it first, then merge in a later turn.
#
# What it watches: `gh pr merge` (any flags, --admin included, -R/--repo), `gh api` calls
# that merge a pull request, and `git push` to the default branch. open-refusals.sh asks
# the whole session family's check results (`sr-checks sql --family`: the root session's
# and every sub-agent's, which keep their own stores) for refusals at the landing commits,
# found by branch name AND by the PR head's oid; the policy is all in that script.
#
# It refuses on FACTS and nothing else: open refusals, unjudged commits, or a target it
# cannot determine. No user citation lifts it (a user's word is not a reason to land work a
# rule refused, and an agent could wash an old instruction into one); the remedy is to fix
# the work, let the Stop judge the new tip, or name the pull request literally. Engine
# failures (a run that errored without refusing anything) are not refusals of the work.
#
# It FAILS CLOSED: a command whose target the script cannot determine (a shell variable
# or loop in place of the PR number, an unknown flag, a PR gh cannot look up) is refused
# with the advice to name the pull request literally.
#
# On by default, like every shipped rule, and switched off the same way: list
# `sloprail/gate/no-merge-over-refusals` under `disabled:` in .sloprail/config.yaml
# (a change to that file is itself gated by grounded-rule-changes).
on:
  - event: PreCommandInvoke
    match: >
      any(event.invocations,
        (.bin == "gh" and any(.argv, # == "pr") and any(.argv, # == "merge")) or
        (.bin == "gh" and any(.argv, # == "api")) or
        (.bin == "git" and any(.argv, # == "push")))
checks:
  - script: ./open-refusals.sh
