# Refuses a write to a check script (.sh under file-guard/gate/context) until
# script-checks.md and check-template.sh were read. The WHY (measured onboarding
# eval, what `require: files` checks natively, why it runs before any judge) is
# written once, in ../../file-guard/read-script-checks-doc/file-guard.yaml; this is
# the prevention half (refuses before the write lands), that one the Stop backstop.
on:
  - event: PreFileWrite
    match: '(event.path contains ".sloprail/file-guard/" or event.path contains ".sloprail/gate/" or event.path contains ".sloprail/context/") and event.path endsWith ".sh"'

require:
  - skill: authoring-guardrails
    files: [script-checks.md, check-template.sh]
