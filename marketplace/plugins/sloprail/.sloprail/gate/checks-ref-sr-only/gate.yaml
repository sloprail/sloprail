# The sloprail/checks branch holds the verdicts `sr-checks run` stored; `sr-checks verify` (and the
# verify-before-push gate) believe them. An agent that could write, move, delete or push that ref
# could forge a pass, so only `sr-checks` writes it. This refuses a git command that names the
# ref and is not a read (log, show, rev-parse, ls-tree, ...), and a file write into the ref's
# storage under .git. Reading it, and running sr-checks, stay allowed.
#
# On by default, like every shipped rule, and switched off by listing
# `sloprail/gate/checks-ref-sr-only` under `disabled:` in .sloprail/config.yaml.
on:
  - event: PreCommandInvoke
    match: >-
      any(event.invocations, .bin == "git" and any(.argv, # contains "sloprail/checks"))
  - event: PreFileWrite
    match: 'event.path contains ".git/refs/heads/sloprail/checks" or event.path contains ".git/logs/refs/heads/sloprail/checks"'
  - event: PreFileDelete
    match: 'event.path contains ".git/refs/heads/sloprail/checks" or event.path contains ".git/logs/refs/heads/sloprail/checks"'
checks:
  - script: ./refuse.sh
