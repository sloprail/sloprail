# Destroying work before it was judged is landing it where no rule can hold it, the same
# trap no-merge-over-refusals closes for a merge: delete the branch, force it elsewhere,
# remove the worktree, prune the objects, and the commits a Stop would have judged (and
# the refusal that would have come with them) are gone. This gate refuses those commands
# while the ref they would destroy holds commits this session (or one of its sub-agents)
# has not had judged, or that a rule refused and nobody fixed.
#
# What it watches (git, however it is spelled: env prefixes, bash -c, `cd <dir> &&`,
# `git -C <dir>`):
#   branch -d/-D/--delete, branch -f <existing>, checkout -B / switch -C <existing>,
#   push <remote> --delete <b> or :<b>, update-ref -d, worktree remove [--force],
#   reset --hard (--keep, --merge) to a commit that does not contain the branch's tip
#   (--soft and --mixed keep the content: the squash the engine's own refusals advise),
#   gc --prune / prune / reflog expire|delete (these endanger everything at once).
# `gh pr merge --delete-branch` is no-merge-over-refusals' (it refuses the same merge).
#
# "Owed" is the same notion as the merge gate's (owed-work.sh, shared): read from every
# store of the session family, `sr-checks sql --family`. Engine failures are not refusals
# of the agent's work and are never listed as such. A command whose target cannot be told
# (a shell variable, a ref that does not resolve) is refused when ANYTHING is owed at all,
# and passes when nothing is: destroying nothing that is owed harms nothing.
#
# It refuses on FACTS: no user citation lifts it. The way forward is to end the turn so Stop
# (a sub-agent's Stop, for its work) judges the branch, then delete, or to name the target
# literally. Dropping owed work stays the user's, through the grounded path:
#   sr-session refs abandon --ref <b> --folder <dir> --cite-user '<their exact words>'
#
# On by default, like every shipped rule; switch it off with `disabled:` in
# .sloprail/config.yaml (a change to that file is itself gated by grounded-rule-changes).
on:
  - event: PreCommandInvoke
    match: >
      any(event.invocations, .bin == "git" and (
        any(.argv, # == "branch") or any(.argv, # == "push") or any(.argv, # == "update-ref") or
        any(.argv, # == "worktree") or any(.argv, # == "reset") or any(.argv, # == "checkout") or
        any(.argv, # == "switch") or any(.argv, # == "gc") or any(.argv, # == "prune") or
        any(.argv, # == "reflog")))
checks:
  - script: ./destroys-owed.sh
