# A gate's own YAML (on/match/require/checks — the checkpoint-on-an-event
# shape) is documented in gate.md — the page that shows the event-nested
# match scope (`event.path`, not bare `path`), the `on:` trigger list, and
# `require`'s ordering guarantee against a context. See
# read-script-checks-doc/gate.yaml for the shared argument for why
# `require: [{skill, files}]` is the right mechanism here.
#
# A PreFileWrite gate refuses the write
# before it lands. There is no file-guard backstop: a file-guard judges committed
# bytes at Stop and cannot see whether a page was read this session.
on:
  - event: PreFileWrite
    match: 'event.path matches "^\\.sloprail/gate/[^/]+/gate\\.ya?ml$"'

require:
  - skill: authoring-guardrails
    files: [gate.md]
