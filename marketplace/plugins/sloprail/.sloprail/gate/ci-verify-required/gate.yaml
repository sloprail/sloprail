# A file-guard's verdict is only worth something where it is enforced. `sr-checks run` writes the
# verdicts; `sr-checks verify` reads them and exits 1 on a commit nobody judged clean. The Stop hook
# and verify-before-push verify on the agent's machine, which the agent controls. The enforcement a
# team can rely on is a CI job that runs
#
#   pull request:  sr-checks verify --base <target branch> --head <PR head sha>
#   push to the default branch:  sr-checks verify --base <push before sha> --head <push after sha>
#
# on every pull request AND on every push to the default branch (a direct push has no PR to gate it). This gate refuses the end of a turn in a project that loads file-guards
# until the committed tree shows such a job.
#
# Detected by a MARKER, never by a provider's file path, so GitHub Actions, GitLab CI, Azure
# Pipelines, Bitbucket, Jenkins and the rest are all the same: any committed file carrying the
# sloprail marker `sr:ci verify` (a comment next to the `sr-checks verify` step, written by
# `sr-mark apply ci --verify=<path>:<line>`). It is looked up with `sr-mark find ci --fqn verify`,
# which reads HEAD, the committed tree, with the engine's own marker reader, so an uncommitted CI
# file does not count and neither does free text that merely resembles the marker. The gate does
# not parse the CI config; the file-guard `sloprail/file-guard/ci-verify-step` checks that a marked
# file really runs `sr-checks verify` on pull requests and pushes to the default branch.
#
# Applies only where the project has its OWN file-guards: a committed file under
# `.sloprail/file-guard/`. Guards a plugin ships are not the project's to enforce in its CI, and a
# project with none passes. Fails closed: a git error is a refusal, not a pass. Every Stop until
# fixed (the stop_hook_block_cap in .sloprail/config.yaml bounds the loop).
#
# On by default, like every shipped rule, and switched off by listing
# `sloprail/gate/ci-verify-required` under `disabled:` in .sloprail/config.yaml.
on:
  - event: Stop
checks:
  - script: ./check.sh
