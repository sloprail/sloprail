# The engine's lifecycle entry points are for the harness's hooks, never for the agent.
# `sr-session start`, `stop`, `pre-tool`, `subagent-start`, `subagent-stop` and `worktree-remove` are what Claude Code's hooks
# run (hooks/hooks.json), outside any agent command, with the real session on stdin. An
# agent that runs them itself invents a session (sub-agents were seen running `start` and
# `stop` 23 times with made-up session ids) to record verdicts or get a judgement of its own:
# a pass nobody earned, in a store the real session does not read. Judging is the engine's:
# `sr-checks run --base <rev> --head <rev>` judges a commit range, the Stop hook only verifies
# the stored verdicts, and the verify-before-push gate refuses a push until they pass.
#
# Only commands the AGENT runs reach this gate (PreCommandInvoke is the agent's Bash tool);
# the hook wrapper invokes the binary itself, outside it. Read-only commands stay allowed:
# `sr-session trajectory`, `state get/list`, `sr-checks changeset|show|verify`, `sr-checks run`.
# `start` is refused too, even as `sr-session start < /dev/null`: load errors are reported to
# the agent at every hook and at Stop, so an agent never needs to run it.
#
# On by default, like every shipped rule, and switched off by listing
# `sloprail/gate/no-lifecycle-commands` under `disabled:` in .sloprail/config.yaml.
on:
  - event: PreCommandInvoke
    match: >-
      any(event.invocations,
        (.bin == "sr-session" and len(.argv) > 1 and
          (.argv[1] == "start" or .argv[1] == "stop" or .argv[1] == "pre-tool" or .argv[1] == "subagent-start" or .argv[1] == "subagent-stop" or .argv[1] == "worktree-remove")) or
        (.bin == "sr" and len(.argv) > 2 and .argv[1] == "session" and
          (.argv[2] == "start" or .argv[2] == "stop" or .argv[2] == "pre-tool" or .argv[2] == "subagent-start" or .argv[2] == "subagent-stop" or .argv[2] == "worktree-remove")))
checks:
  - script: ./refuse.sh
