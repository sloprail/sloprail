# A task's frontmatter is valid, its artifacts resolve, and its move into
# in_review is grounded in tool output — the DETERMINISTIC floor of task
# management. It spends no model call and answers only questions a schema check, a
# filesystem lookup, or the event's own citations can settle. The full argument
# lives in the plugin's README.
#
# TWO KINDS OF DELIVERY EVIDENCE, TWO PLACES (2026-09). The repository keeps
# derived text only, never a transcript path — a session .jsonl resolves on no
# other machine. So:
#   - an ARTIFACT `<repo-relative-file>:<ranges>` stays in the FRONTMATTER: it
#     names repository content. The file exists under the repo and every cited
#     line exists — the file-citation check task.cue cannot make.
#   - the PROOF that the work happened is tool output (a test run that came back
#     green), and it rides on the COMMIT that moves the task into in_review, as a
#     trailer: `git commit -m 'Move to in_review' -m 'Sloprail-Cites-Tool: <exact
#     output>'`. (The frontmatter `observations:` list of absolute `.jsonl:<ranges>`
#     strings this replaced is gone from the schema.)
#
# THE REQUIREMENT IS DECLARED, CONDITIONALLY. Tool output is not demanded on
# every write to a task — creating one, changing its priority. Only the
# TRANSITION into in_review (status at the range's base not in_review, at head
# in_review) is a claim of finished work, so `require` applies when
# `./in-review.sh --entering` says the changeset makes it. An uncited transition is
# refused by the engine before check-task.sh runs.
#
# THIS IS THE STRUCTURAL HALF ONLY. It answers "is the evidence there", never
# "does the evidence substantiate the claim" — that is task-review's model call,
# gated behind this. The split is crisp and deliberate; see the README.
#
# A SCRIPT check. The logic is deterministic — `sr-file validate` for the schema,
# the tree checker for artifacts — so it stays a script; no model, so no judge.
#
# match: the task file, TWO directory levels deep —
# `memories/tasks/<category>/<name>/TASK.md`, the old regex
# `^memories/tasks/[^/]+/[^/]+/TASK\.md$`. A `matches` expression (not a glob): a
# single-`*` glob is one segment and would not require two arbitrary levels
# precisely. The file-match scope compiles `matches` as a regex over `path`
# (internal/guardrail/scopes.go), the same operator the old format used.
match: path matches "^memories/tasks/[^/]+/[^/]+/TASK\\.md$"

# The PREVENTION half — refusing a malformed or unproven TASK.md before it lands
# (the right moment for a rule about permission to act) — is the PreFileWrite gate
# of the same name, beside this guard under gate/. This file-guard judges the
# committed changeset: every task the range touched, with the commits' citations.
# check-task.sh reads each task's committed bytes and resolves its artifacts
# against the committed tree.

require:
  - citation: {source_types: [tool_result]}
    when: ./in-review.sh --entering

checks:
  # Deterministic, fail-closed throughout. A refusal exits non-zero with
  # `{"reason": "..."}` on stdout.
  - script: ./check-task.sh
