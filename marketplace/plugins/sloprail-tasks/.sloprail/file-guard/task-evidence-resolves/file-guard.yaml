# A task's frontmatter is valid and its DELIVERY-evidence citations resolve — the
# DETERMINISTIC floor of task management. It spends no model call and answers only
# questions a schema check, a transcript lookup, or a filesystem lookup can settle:
# every memories/tasks/<category>/<name>/TASK.md must satisfy
# .sloprail/schemas/task.cue, and every observation/artifact citation in its
# frontmatter must resolve to the thing its KIND promises. The full argument lives
# in the plugin's README, migrated from the old-format rule doc.
#
# TWO CITATION KINDS, DIFFERENT PATH BASES (2026-08-21). The delivery evidence is
# structured FRONTMATTER, not body links (the body's ask is task-body-is-human-
# authored's subject). The two kinds resolve differently:
#   - an OBSERVATION `<abs-jsonl>:<ranges>` — every cited line must be a tool_result
#     the session produced, confirmed by `sr-session trajectory tool-result --line`
#     (the same tool_result classification cite's --source-types tool_result uses).
#   - an ARTIFACT `<repo-relative-file>:<ranges>` — the file exists under the repo
#     and every cited line exists, the file-citation checker task.cue cannot make.
# The path base ROUTES each: an observation is absolute and a transcript, an artifact
# is repo-relative and a tree file, and one wearing the other's shape is refused.
#
# THIS IS THE STRUCTURAL HALF ONLY. It answers "do the citations resolve", never
# "does the evidence substantiate the claim" — that is task-review's model call,
# gated behind this. The split is crisp and deliberate; see the README.
#
# A SCRIPT check, migrated from the old-format Pre+Post command hook (check-task.sh).
# The detection logic is deterministic — `sr-file validate` for the schema, the
# transcript reader and the tree checker for the two citation kinds — so it stays a
# script; no model, so no judge: to convert to.
#
# match: the task file, TWO directory levels deep —
# `memories/tasks/<category>/<name>/TASK.md`, the old regex
# `^memories/tasks/[^/]+/[^/]+/TASK\.md$`. A `matches` expression (not a glob): a
# single-`*` glob is one segment and would not require two arbitrary levels
# precisely. The file-match scope compiles `matches` as a regex over `path`
# (internal/guardrail/scopes.go), the same operator the old format used.
match: path matches "^memories/tasks/[^/]+/[^/]+/TASK\\.md$"

# preventive: true reproduces the old Pre+Post binding. A preventive file-guard
# fires on the PRE write to refuse a malformed/ungrounded TASK.md before it lands
# (the right moment for a rule about permission to act), AND, like every guard,
# fires the after-check at Stop on the SETTLED file. The Post after-check is the
# backstop Pre cannot cover: a task written by a command/heredoc/sed whose result
# the engine cannot derive reaches Pre unverifiable — a preventive guard fails
# CLOSED engine-side there and the settled file is judged at Stop, where newContent
# carries the settled bytes off the tree diff. check-task.sh handles both moments:
# it dispatches on .event.kind, consulting .event.resultKnown on the Pre kinds
# before reading .event.newContent, and reading the file on disk on Post.
preventive: true

checks:
  # Deterministic, fail-closed throughout. A refusal exits non-zero with
  # `{"reason": "..."}` on stdout.
  - script: ./check-task.sh
