# A task's BODY is the human's ask, grounded, and nothing else — the guard that
# protects the ORACLE rather than an artifact. Every other guard here protects
# something the work produces; this one protects the specification all the others
# are checked against. The failure it prevents has no detector once it happens: an
# agent implements 70% of an ask, edits the body to describe that 70%, and from
# then on every verification passes because the spec was rewritten to match the
# work. The full argument lives in the plugin's README.
#
# THE CITATION RIDES ON THE WRITE, NOT IN THE FILE. A task's body used to quote the
# user as inline `[quote](/abs/session.jsonl:N)` links — a transcript path that
# resolves on no other machine. Now the file keeps derived text only, and the write
# that creates a task or changes its body carries the user's words as a citation:
#
#   sr-file write|edit memories/tasks/<group>/<name>/TASK.md … --cite:user '<exact words>'
#
# run on its own line, so the pre-tool hook resolves it exactly. The session
# resolves every quote against its record before any check runs and puts the ones
# that resolve on `.event.citations`, so a citation a check sees EXISTS.
#
# WHY NOT `require: [{citation: {source_types: [user]}}]`. That makes a citation
# mandatory for EVERY
# write the guard covers, and grounding here is conditional: only a create or a
# BODY change needs one. A status/priority/depends_on edit leaves the body
# byte-identical and is permitted uncited. So the condition lives in the script.
#
# TWO checks, cheap first:
#
#   1. SCRIPT (body-change-is-cited.sh): deterministic, no model. If the write
#      creates the task, or its body differs from `.event.oldContent` (the file on
#      disk at Pre, the session baseline at Post), `.event.citations` must hold at
#      least one citation whose sourceTypes include `user`; otherwise it refuses,
#      naming the exact sr-file form. A body-unchanged write is permitted here.
#      Existing bodies that still carry the old inline links are neither required
#      nor refused.
#   2. PREPARE + JUDGE: prepare (resolve-cited-messages.sh) SKIPS the judge when
#      no grounding was required (no model call on a status-only change); otherwise
#      it hands the judge each cited quote and its transcript `path:line` as the
#      ground truth. judge-body.md.j2 asks whether the body CORRESPONDS to the cited
#      words and holds THAT AND NOTHING ELSE.
#
# THE POST MOMENT AND UNCITED FRONTMATTER EDITS. A Post event at Stop carries
# every citation the path's changes were made with this session — cited changes
# accumulate, and an uncited change (the status-only edits this guard permits)
# leaves them in place. So a task created with a citation and then moved to
# in_progress by a plain edit still reaches Stop with its ask's citation. Each
# uncited BODY change is refused at pre-tool, which is why the guard is preventive.
#
# FAIL-OPEN RECONCILIATION (flagged, not hidden). The old judge failed OPEN on its
# own machinery (no sr-agent, a timeout, an unparseable verdict). A judge: check
# cannot reproduce that — the engine's judge path fails CLOSED on machinery failure
# by deliberate design (internal/dispatch/judge.go) — so those cases refuse. The
# deterministic half fails closed too.
#
# match: the task file, TWO directory levels deep —
# `memories/tasks/<category>/<name>/TASK.md`. A `matches` expression (not a glob):
# a single-`*` glob is one segment and would not require two arbitrary levels
# precisely. The file-match scope compiles `matches` as a regex over `path`.
match: path matches "^memories/tasks/[^/]+/[^/]+/TASK\\.md$"

# preventive: true — an edit to the ask must be refused BEFORE it lands: a Post
# refusal reports damage already done to the oracle, and the agent's remedy would be
# to edit the task again — the prohibited act itself. The Stop after-check is the
# backstop for a write that reached the tree without passing pre-tool.
preventive: true

checks:
  # Stage 1 — deterministic, fail-closed. Refuses with `{"reason": "..."}` on
  # stdout, exit non-zero.
  - script: ./body-change-is-cited.sh

  # Stage 2 — the judge, reached only when stage 1 passed, and skipped by its
  # prepare when the body did not change. model is size-md (the engine default
  # judge modelset; an unpinned model resolves larger and this can fire several
  # times per turn); no explicit timeout — it runs under the engine's own default
  # (internal/dispatch/exec.go's defaultCheckTimeout). allowed_tools: [Read] adds
  # Read on top of the Write the judge substrate always grants for the verdict
  # file, so the judge may open a cited transcript line or the file on disk.
  - prepare: ./resolve-cited-messages.sh
    judge: ./judge-body.md.j2
    model: size-md
    allowed_tools: [Read]
