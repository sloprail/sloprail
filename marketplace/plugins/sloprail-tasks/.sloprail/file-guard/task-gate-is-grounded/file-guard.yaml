# A gate file — memories/tasks/<group>/<name>/gates/<gate-name>.(sh|md) — must
# be DERIVED FROM the task it belongs to before it is allowed to land. This is
# the protection against an agent weakening or rubber-stamping a start
# condition on one side (a trivial `exit 0` .sh, or a toothless .md) and
# against an agent INVENTING a hurdle the user never asked for on the other —
# the same failure mode task-body-is-human-authored guards for the ask itself,
# relocated to gate files, because task-gates-hold TRUSTS every gate under
# gates/ to already be a meaningful, honestly authorized test (see its own
# header) and nothing else re-checks a gate's content once it exists.
#
# A GATE CARRIES NO CITATIONS OF ITS OWN. Only a commit that creates a
# TASK.md or changes its body is grounded in the user's words (a
# Sloprail-Cites-User: trailer), and that grounding is task-body-is-human-authored's
# subject — already validated separately, every time TASK.md's body is
# written. A gate is DERIVED FROM the task, not from the transcript, so this
# guard asks one question with one check: is this gate file traceable to,
# non-contradicting of, and non-trivial against the task's OWN content (as it
# stands) — never a second citation-grounding pipeline duplicating what
# already validated the task body.
#
# ONE check, no script stage: prepare (resolve-gate-context.sh) hands the
# judge the gate file's own text and the sibling TASK.md's full content;
# judge-gate.md.j2 asks the model whether the gate is TRACEABLE to the task,
# does not CONTRADICT it, does not INVENT beyond it, and — for a `.sh` gate
# specifically — is not TRIVIAL (a script that can never actually fail, e.g.
# an unconditional `exit 0`). The trivial-gate check matters because `.sh`
# gates are agent-writable scripts task-gates-hold will run and trust; this
# judge is what stops a rubber-stamp script from ever landing in the first
# place.
#
# WHY A JUDGE AND NOT A DETERMINISTIC "IS THIS TRIVIAL" SCRIPT. Whether a
# script's logic can ever fail, and whether a prompt's condition is
# traceable to / contradicts / invents beyond a task, are judgment calls over
# arbitrary shell and prose — not decidable by a fixed pattern without both
# false positives (a legitimate check shaped unusually) and false negatives
# (a disguised rubber stamp).
#
# match: any gates/*.sh or gates/*.md file under a task, three levels below
# memories/tasks/ (group/name/gates/file), mirroring the task file guards'
# own two-level regex plus the gates/ segment and the two extensions.
match: path matches "^memories/tasks/[^/]+/[^/]+/gates/[^/]+\\.(sh|md)$"

# The PREVENTION half — a gate that fails the grounding bar must never land — is
# the PreFileWrite gate of the same name, beside this guard under gate/. This
# file-guard judges the committed gates, backstopping a write the gate could not
# derive. All the gates in the changeset go to one judge.

checks:
  # The judge. prepare (resolve-gate-context.sh) reads each gate from
  # the changeset and its task from SR_TREE. model is size-md (engine default judge modelset), matching
  # the plugin's other judges; no explicit timeout — it runs under the
  # engine's own default. The task and gate content are both already IN the
  # prompt; the judge can also read the project on disk without any grant (the
  # engine passes it as readonly). allowed_tools: [Read] only adds reads
  # outside the project. The verdict file's write is the engine's, not this
  # list's.
  - prepare: ./resolve-gate-context.sh
    judge: ./judge-gate.md.j2
    model: size-md
    allowed_tools: [Read]
