# A file inside a task folder (memories/tasks/<group>/<task>/) may only be
# written once that task's TASK.md exists. Without it the folder names no
# ask, no status, no priority — task-body-is-human-authored, task-evidence-
# resolves and task-review all key off TASK.md, so anything else in the
# folder is orphaned. The same failure unit-md-first guards for a content
# unit, relocated to the task shape: an agent wrote a gate or a supporting
# file into a task folder that had no TASK.md yet.
#
# match covers BOTH shapes structure.yaml allows inside a task folder — a
# file directly under it, and one nested one level further under gates/ — by
# matching anything past the two-segment <group>/<task> prefix and excluding
# only the TASK.md leaf itself, wherever it sits relative to that prefix.
#
# The PREVENTION half — refusing the write before it lands — is the PreFileWrite
# gate of the same name, beside this guard under gate/. This file-guard is the
# backstop (`sr-checks run`, verified at Stop and CI): it re-judges the committed file (catches a shell write the gate
# could not see). deletions is left at its default (skip): the reviewer deletes an
# APPROVED task's whole folder (TASK.md included) as its own next step
# (task-review's README, "the accepted task is deleted by the agent in a
# commit of its own") — that delete must not be this guard's business, and a
# default file-guard's PostFileDelete is never dispatched to it at all.
match: path matches "^memories/tasks/[^/]+/[^/]+/.+$" and not (path endsWith "/TASK.md")
checks:
  - script: ./check.sh
