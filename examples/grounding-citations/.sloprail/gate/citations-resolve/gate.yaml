# PREVENTION half of citations-resolve: a write to a markdown file must cite a
# tool's output from this session (`require: citation`, tool_result pool), so an
# uncited write — Write tool, a shell redirect — is refused before it lands, naming
# the sr-file form. Whether the file SAYS what the cited output says is the judge's
# question, and the judge lives in the plain file-guard of the same name (Stop).
#
# require-known-result.sh refuses a write whose result the engine could not compute
# (`resultKnown: false`): a gate does not fail closed on that by itself.
on:
  - event: PreFileWrite
    match: 'event.path endsWith ".md"'
require:
  - citation: {source_types: [tool_result]}
checks:
  - script: ./require-known-result.sh
