# The second use case in the raw dictation (2026-08-12, transcript line
# 2027) is "cataloging"/competitive research, and it names THREE separate
# tests: enough keywords covered, an actual repo clone, and — the test this
# gate owns — a registry table of keywords cross-referenced against WHICH
# trajectory covered each one ("Все эти ключевые слова тоже записало в
# табличку реестра. И образом мы потом эту табличку референсили на
# определенные траектории" — logged into a registry table, then that table
# cross-referenced against specific trajectories). His own words: "a
# SEPARATE test from raw depth" — depth (research-rigor's gate) checks page
# count; this checks the TABLE itself is complete and each entry traceable.
#
# Two-level, not flat (his catch, 2026-08-19, after an earlier draft treated
# this as a flat keyword-list): a competitive-research run can fan out into
# SEVERAL trajectories — one per competitor/angle, the same parallel-agent
# shape unit 11 named ("убедиться в том, что каждая такая траектория была
# отдельным агентом") — so the table is keyword × trajectory, not keyword ×
# single pointer. The same keyword can legitimately appear under more than
# one trajectory.
#
# The table is DERIVED, not agent-written (review, PR #19 review 4974546461:
# "who puts in keywords into registry?" — an earlier draft had the agent
# call `sr-session state set` directly, an unenforced, unverifiable claim).
# verify-registry-complete.sh builds it itself off real `gh search` / `gh
# api search/... -f q=<term>` invocations across every trajectory this run
# touched — there is no separate write step for an agent to skip or fake.
on:
  - event: Stop
checks:
  - script: ./verify-registry-complete.sh
