# Two separate concerns, not one: (1) do the keywords even get written down
# anywhere real, and (2) once they are, did a search actually cover them. This
# context owns (1) — a scanner is declared FIRST, as a real file, before any
# search happens; the sibling gate (verify-scanner-coverage) owns (2), checking
# searches against what this context logged, never the other way around.
#
# scanners/<name>/scanner.yaml declares one scanner: { active: bool,
# keywords: str[] }. "Scanner" because it groups the keywords that must ALL
# appear together in ONE gh call — not a flat bag of terms checked
# independently. One scanner maps naturally to one research angle, though
# nothing here enforces that pairing.
on:
  - event: PostFileCreate
    match: event.path startsWith "scanners/" and event.path endsWith "/scanner.yaml"
  - event: PostFileUpdate
    match: event.path startsWith "scanners/" and event.path endsWith "/scanner.yaml"
enter: ./enter.sh
exit: ./exit.sh
