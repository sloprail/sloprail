# Two separate concerns, not one (his correction, 2026-08-19, after an
# earlier draft had this backwards): (1) do the keywords even get written
# down anywhere real, and (2) once they are, did a search actually cover
# them. This context owns (1) — a scanner is declared FIRST, as a real file,
# before any search happens; the sibling gate (verify-scanner-coverage)
# owns (2), checking searches against what this context logged, never the
# other way around.
#
# scanners/<name>/scanner.yaml declares one scanner: { active: bool,
# keywords: str[] }. "Scanner" because it groups the keywords that must ALL
# appear together in ONE gh call (his shape, 2026-08-19: "ensuring that gh
# call has all keywords in 1 call") — not a flat bag of terms checked
# independently. One scanner maps naturally to one research trajectory/angle
# (unit 11's shape), though nothing here enforces that pairing.
on:
  - event: PostFileCreate
    match: path startsWith "scanners/" and path endsWith "/scanner.yaml"
  - event: PostFileUpdate
    match: path startsWith "scanners/" and path endsWith "/scanner.yaml"
enter: ./enter.sh
exit: ./exit.sh
