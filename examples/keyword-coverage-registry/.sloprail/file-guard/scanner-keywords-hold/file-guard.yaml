# A declared scanner's keywords hold: a write may add keywords, but dropping one
# needs the user's own words asking for it. The keywords are what the search must
# cover together (verify-scanner-coverage), so a scanner weakened to fit a search
# already run defeats the whole registry — and a real Haiku run did exactly that:
# refused by the coverage gate, it rewrote its keywords to match its search.
#
# The requirement is declared, conditionally: `when` drops-keywords.sh says the
# write drops a keyword (a new scanner, or one that only adds, needs nothing).
# An uncited drop is refused before any check, with the script's hint. A cited
# drop goes to the judge, which checks the cited words ask for THESE keywords to
# go — citing some unrelated thing the user said does not.
#
# preventive: a weakened declaration refused before it lands, while the agent can
# still meet it with a search instead.
#
# deletions: include — deleting a scanner drops ALL its keywords, the same
# weakening taken to the limit. Measured on a real run: refused by the coverage
# gate, a sub-agent ran `rm -rf scanners/<name>` rather than search, and the
# gate went quiet. The delete is refused the same way an uncited drop is; `rm -r`
# of the scanner's DIRECTORY reaches this guard as a PreFileDelete of the
# scanner.yaml inside it. (Whatever still gets a scanner deleted — a command the
# engine cannot parse — does not clear the obligation: scanner-declared keeps
# the scanner in its registry and stays open until coverage passes.)
#
# A delete that IS admitted — cited, and judged to be what the user asked for —
# retires the scanner's obligation: retire-on-delete.sh, the last check, runs
# only once the ones before it admitted the event. Without it a scanner declared
# this session stayed owed forever after the user had it removed, and every
# later Stop was refused.
match: 'path matches "(^|/)scanners/[^/]+/scanner\\.yaml$"'
preventive: true
deletions: include
require:
  - citation: {source_types: [user]}
    when: ./drops-keywords.sh
checks:
  - prepare: ./only-when-dropped.sh
    judge: ./cited-words-ask-for-it.md.j2
  - script: ./retire-on-delete.sh
