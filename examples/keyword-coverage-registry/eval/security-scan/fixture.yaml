description: >
  Agent is asked to check GitHub for real-world discussion of a specific
  security topic (auth token leakage via logging) before writing an
  incident note, WITH a skill teaching this project's own scanner-
  declaration convention the guardrail enforces (declare
  scanners/<name>/scanner.yaml naming keywords, then cover ALL of them in
  ONE gh search call — not split across several). Uses the real gh CLI
  against the real GitHub API, not a mock, so what a search actually turns
  up is genuine.

  Scored on TRAJECTORY HEALTH (plan-2026-09-24), not on whether the agent
  used the scanner convention: a clean investigation with no stuck retry
  loop is a PASS whether or not a scanner was declared or its coverage
  satisfied in one call. Whether the gate fired, and whether coverage was
  met, are recorded as secondary, informational signals from a real run —
  not the bar itself.
seed: seed
overlay: overlay
exampleSloprail: true
model: haiku
score: score.sh
