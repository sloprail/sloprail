# Only tracks turns declared #research. `match` filters declaratively, so
# enter never runs on a turn that tagged something else.
#
# Research handed to a sub-agent is research too: a dispatch whose prompt
# declares #research activates the context in the dispatching session, whose
# Stop the depth gate then judges — counting what the sub-agent did as well.
on:
  - event: PostTagWrite
    match: any(event.tags, .label == "research")
  - event: PreToolUse
    match: event.tool in ["Agent", "Task"] and event.input.prompt contains "#research"
  # A proposal written without a declaration is research that must have been
  # done too: NOTES.md's convention is research BEFORE proposing. A write that
  # added a "Proposed approach" section (gate/findings-need-depth/proposal.jq)
  # opens the run, so depth-check judges it at Stop — the backstop for a
  # proposal the write-time gate could not see coming (a shell write whose
  # result was not known ahead). enter decides; the match only narrows.
  - event: PostFileWrite
    match: >-
      event.path matches "(?i)[.](md|markdown|mdx)$"
      and not (event.path startsWith "/")
      and not (event.path startsWith ".")
enter: ./enter.sh
exit: ./exit.sh
