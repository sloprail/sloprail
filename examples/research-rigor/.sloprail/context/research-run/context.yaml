# Depth-checking only makes sense if this branch of the trajectory was
# declared as research in the first place. Wakes directly on PostTagWrite
# instead of an enter script grepping the trajectory for #research — the
# engine has already found the tags by the time this fires. `match` filters
# for #research declaratively, so enter is not even called on a turn that
# tagged something else.
on:
  - event: PostTagWrite
    match: any(event.tags, .label == "research")
enter: ./enter.sh
exit: ./exit.sh
