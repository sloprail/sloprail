# A file-guard's scope exposes the file's markers as a LIST (`markers`), so a
# marker test is a quantifier over it — `any(markers, .kind == "invariant")` —
# not a singular `marker.kind`.
#
# deletions: include — the rule is about the file's state regardless of which
# commit last touched it (see the README); an invariant-pinned file may not
# quietly disappear as a silent escape from a stale pin. A deleted file's pins are
# checked (its oldMarkers); the judge, which reads code, skips it.
#
# Not in agent-config docs (.claude/{skills,commands,agents}/**.md): a skill's SKILL.md documents the marker with a placeholder
# (`// sr:invariant "<the rule>"`), and the scanner reads a marker anywhere in a
# file's text, so that example would pose as a real pin. These rules are about
# code; a doc is not code. Narrowing by path loosens nothing in real
# code, where skipping `<...>` fqns would also skip a genuine pin whose text opens
# with "<" (a rule like "<5 days").
match: any(markers, .kind == "invariant") and not (path endsWith ".md" and (path startsWith ".claude/skills/" or path startsWith ".claude/commands/" or path startsWith ".claude/agents/"))
deletions: include
checks:
  - script: ./pin-still-matches-head.sh
  # prepare reads each marker's pinned spec text and hands it to the judge, so
  # the judge rules on the pin without reading anything: it runs with this
  # folder as its working directory, and a spec outside it is a permission
  # denial away.
  - prepare: ./pinned-text.sh
    judge: ./code-upholds-invariant.md.j2
