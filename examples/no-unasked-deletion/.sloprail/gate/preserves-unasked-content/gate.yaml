# PREVENTION half of preserves-unasked-content: a change that removes content needs
# the user's words cited (`require: citation`, `when` removes-content.sh says the
# change removes something), before it lands; a delete (PreFileDelete) is a removal
# too. Whether the removal is clean and asked-for is the judge's question, and the
# judge lives in the plain file-guard of the same name, which rules on what settled
# at Stop.
#
# require-known-result.sh refuses a create or update whose result the engine could
# not compute (`resultKnown: false`): a gate does not fail closed on that itself.
on:
  - event: PreFileWrite
    match: 'event.path startsWith "memories/" and event.path endsWith ".md"'
  - event: PreFileDelete
    match: 'event.path startsWith "memories/" and event.path endsWith ".md"'
require:
  - citation: {source_types: [user]}
    when: ./removes-content.sh
checks:
  - script: ./require-known-result.sh
