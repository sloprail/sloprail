# An edit must not silently drop content nobody asked to remove (unit 17, his
# 2026-08-14: "a crazy rewrite that silently drops content nobody asked to
# remove is a violation, regardless of whether the new text is good"). The
# load-bearing word is UNASKED — the rule is about the relationship between a
# removal and the human's own trajectory messages, not about removal itself.
#
# Bound to the file's state, PreFileUpdate, preventive:true — the content that
# would be lost is still on disk at Pre time, so the diff is computed BEFORE
# the loss. A Post check could only report a deletion already done, and the
# remedy (restore from git) is gone if the file was never committed — the
# strongest pre-vs-post case in the topic.
#
# Scoped to the memory tree, where the real incident happened (a 27-line
# TOPIC.md overwritten wholesale, its provenance link and his scope wording
# destroyed) and where preserving content is load-bearing. Only certain paths,
# his point — not every file; a project wanting it elsewhere widens the glob.
#
# Two checks, cheap-gates-expensive (same shape as unit 16). The script is a
# line-by-line diff: pure additions (append, zero removed lines) always pass —
# that IS "append instead of rewriting". A removal with no deletion-intent
# anywhere in this turn's human messages is refused outright, deterministically
# (this is what would have caught the incident). Only a removal whose ask was
# phrased loosely ("clean this up", "rewrite it properly") falls through to the
# judge, which is the sole thing a model is needed for.
match: "memories/**/*.md"
preventive: true
checks:
  - script: ./removed-lines-were-asked-for.sh
  - judge: ./loose-ask-covers-removal.md.j2
    prepare: ./collect-removed-and-asks.sh
