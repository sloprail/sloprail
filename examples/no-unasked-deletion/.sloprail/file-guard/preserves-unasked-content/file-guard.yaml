# An edit must not silently drop content nobody asked to remove. The load-bearing
# word is UNASKED: the removal's relationship to the user's own words.
#
# preventive:true so the diff is computed at Pre time, before the loss — a Post
# check is too late, and git-restore is gone on an uncommitted file.
#
# "Asked" is deterministic: the agent writes an `# sr:asked "<quote>"` marker in
# the frontmatter, and the check grounds it with `trajectory cite` — the quote
# must resolve to the user's own words (a message or AskUserQuestion answer).
#
# Two checks, cheap-gates-expensive: the script passes appends, refuses a removal
# lacking a grounded quote, and hands a grounded removal to the judge, which
# rules the model-only properties (change is clean and stated absolutely).
match: 'path startsWith "memories/" and path endsWith ".md"'
preventive: true
checks:
  - script: ./removal-has-a-grounded-ask.sh
  - judge: ./change-is-clean-and-absolute.md.j2
    prepare: ./collect-quote-and-diff.sh
