# An edit must not silently drop content nobody asked to remove. The load-bearing
# word is UNASKED: the removal's relationship to the user's own words.
#
# preventive:true so the diff is computed at Pre time, before the loss — a Post
# check is too late, and git-restore is gone on an uncommitted file.
#
# "Asked" is deterministic: a removal must CITE the user's own words. The agent
# makes the change with `sr-file edit|write|delete <path> ... --cite:user
# '<quote>'`; the engine resolves the quote against the session's record (a
# message or an AskUserQuestion answer) and hands it to the checks on
# `.event.citations`. The quote rides on the command, never in the file.
#
# Not `require: [{citation: {source_types: [user]}}]`: a pure append needs no
# ask, so the need for a citation is CONDITIONAL on something being removed — a
# script decides it.
#
# Two checks, cheap-gates-expensive: the script passes appends, refuses a removal
# that cites nothing, and hands a cited removal to the judge, which rules the
# model-only properties (the change covers only what the cited words asked, and
# is stated absolutely).
#
# deletions: include — deleting a memory is the largest removal there is, so the
# rule covers it as well as edits: `rm` cites nothing and is refused, `sr-file
# delete <path> --cite:user '<quote>'` goes to the judge like any removal. (The
# default, skip, would hand every `rm` a free pass.)
match: 'path startsWith "memories/" and path endsWith ".md"'
preventive: true
deletions: include
checks:
  - script: ./removal-has-a-grounded-ask.sh
  - judge: ./change-is-clean-and-absolute.md.j2
    prepare: ./collect-quote-and-diff.sh
