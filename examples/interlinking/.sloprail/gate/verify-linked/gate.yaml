# This gate checks the people the paired context logged this cycle. It must run
# only when a person actually changed — and SKIP, not refuse, turns where none
# did.
#
# `match: context["people-linked"].active` is what makes it skip. An unmet
# `{context}` prerequisite REFUSES (it is the engine's ordering guarantee, not a
# filter), so require alone would block every turn that touched no people file.
# The match is the filter (fire only while the context is active); the require
# is the ordering (the context entered this cycle before the check reads its
# registry). Both are needed.
on:
  - event: Stop
    match: context["people-linked"].active
require:
  - context: people-linked
checks:
  - script: ./verify-changed-file-linked.sh
