# Separate from goal-tracking on purpose: this is about every evaluation run
# being documented, not about any one target. Re-enters on each eval invocation;
# exit checks completeness across ALL runs so far, not just the one that ran.
on:
  - event: PreCommandInvoke
    match: any(event.invocations, .bin == "eval")
enter: ./enter.sh
exit: ./exit.sh
