# The engine does not read goal.yaml on its own — this context IS the wiring.
# PostFileWrite, not Pre: a goal's `enabled` flag only exists once the write
# has SETTLED (Pre cannot always predict the write), so this reads final content.
#
# This context does NOT block the Stop — it only tracks active/inactive.
# ../../gate/goal-verify/ is what refuses a Stop; this context's exit just
# reads that gate's verdict.
on:
  - event: PostFileWrite
    match: event.path startsWith "goal/" and event.path endsWith "goal.yaml"
enter: ./enter.sh
exit: ./exit.sh
