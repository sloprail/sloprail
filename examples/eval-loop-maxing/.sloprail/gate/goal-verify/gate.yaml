# The inverted "don't stop until target met" verdict lives HERE, not in the
# context (a context's exit only tracks active/inactive; a gate refuses a Stop).
#
# match: context["goal-tracking"].active makes this gate SKIP when no goal was
# declared — a goal-free session has nothing to iterate toward, so its Stop must
# be permitted (`require` alone would BLOCK an unmet dependency and refuse every
# goal-free Stop). `require` still names the context so the check runs only once
# the context has entered this cycle — match's read of active is meaningful only
# after that. Together: skip when inactive, enforce "keep iterating" when active.
on:
  - event: Stop
    match: context["goal-tracking"].active
require:
  - context: goal-tracking
checks:
  - script: ./run-verify.sh
