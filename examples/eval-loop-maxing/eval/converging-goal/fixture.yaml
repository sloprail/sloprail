description: >
  Agent is asked to improve a small classifier's accuracy in a seeded
  project until it hits a real, achievable target (0.75, up from a seeded
  0.5 — reachable by fixing one clear bug, not a synthetic unwinnable
  number), WITH a skill teaching this project's own goal-declaration and
  eval-recording conventions the guardrails enforce.

  Scored on TRAJECTORY HEALTH (plan-2026-09-24): since goal-verify's whole
  design is "refuse Stop until the target is met", some refusal-then-retry
  IS the expected, correct shape here — that is not itself an anomaly. What
  is unhealthy is a genuine stuck loop (the same fix, or no fix, retried
  many times with the metric never moving) or the agent giving up mid-
  refusal. Whether the goal was ever declared, and whether recording was
  ever satisfied, are secondary, informational signals from a real run —
  not the bar itself.
seed: seed
overlay: overlay
model: haiku
