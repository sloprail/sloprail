# Written BY THE AGENT during the trajectory, the moment it commits to a target;
# before that write, `goal/accuracy-target/` does not exist. This is what an
# agent might produce after declaring "keep iterating until accuracy >= 0.95".
#
# The target itself lives in verify.sh, not here — one place for the condition,
# not duplicated as prose and re-parsed inside the script.
enabled: true
script: verify.sh
