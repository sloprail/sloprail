# The marker anchors the rule, not the path — matches any file carrying an
# endpoint marker. Script checks the file-name pattern; judge checks the code
# uses the required libs / ORM / naming.
#
# Not under .claude/: a skill's SKILL.md documents the marker with a placeholder
# (`// sr:endpoint "<verb>-<resource>"`) and the scanner reads a marker anywhere
# in a file's text, so that example would pose as a real endpoint. This rule is
# about code; agent configuration is not code. A path exclusion loosens nothing
# for real code (skipping `<...>` fqns could skip a genuine one).
match: any(markers, .kind == "endpoint") and not (path startsWith ".claude/")
checks:
  - script: ./file-name-matches-pattern.sh
  - judge: ./endpoint-uses-required-libs.md.j2
