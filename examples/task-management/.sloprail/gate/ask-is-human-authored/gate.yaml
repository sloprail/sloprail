# PREVENTION half of ask-is-human-authored: a write to a task's ASK.md must cite the
# user's words (`require: citation`), before it lands. Whether what the ask says is
# true to the cited words and only that is the judge's question, and the judge lives
# in the plain file-guard of the same name (Stop).
#
# require-known-result.sh refuses a write whose result the engine could not compute
# (`resultKnown: false`): a gate does not fail closed on that by itself.
on:
  - event: PreFileWrite
    match: 'event.path matches "(^|/)tasks/[^/]+/[^/]+/ASK\\.md$"'
require:
  - citation: {source_types: [user]}
checks:
  - script: ./require-known-result.sh
