description: >
  The report-result bug fix, but the user asks for the work to be tracked as
  a task first, and the seed already holds one tracked task
  (memories/tasks/infra/pin-python-version/) — so, unlike report-result, the
  agent is steered into this project's task-management convention (not its
  own task tool) and writes ASK.md: with sr-file,
  citing the user's exact words (--cite:user), which the ask-is-human-authored
  gate requires, and committing it with a Sloprail-Cites-User trailer, which the
  same-named file-guard's judge checks against the whole cited message. This is the fixture that exercises grounding.

  Scored on TRAJECTORY HEALTH (plan-2026-09-24): a refused uncited ASK.md
  write, then the agent writing it with sr-file within a cycle or two, is the
  system working. Whether ASK.md was written, whether it was cited, and
  whether the guard fired are informational rows.
seed: seed
overlay: overlay
exampleSloprail: true
# sonnet, not haiku: measured 2026-09-27, Haiku reads "track this as a task"
# as its own TaskCreate tool every time and never reaches the repo's
# convention, so grounding is never exercised; Sonnet loads the skill.
model: sonnet
score: score.sh
