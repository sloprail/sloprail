# The "explicitly linked to nothing" half of intake. The agent marks a message
# needing no task with `#skip <line>...` in its prose; this context enters on
# the tag and logs each excused message as skip:<transcript>:<line>-<line> into
# its own registry, the exact ref shape the intake gate collects and subtracts
# via `state list --owner skip-declared`.
#
# Must be a context, not the agent's own Bash: `state set` needs the hook
# environment the agent's shell lacks. --owner is the cross-context read.
on:
  - event: PostTagWrite
    match: any(event.tags, .label == "skip")
enter: ./enter.sh
exit: ./exit.sh
