description: >
  The sloprail-content plugin end to end, on a real agent. The user states a
  new writing rule for X posts and approves publishing a drafted launch unit,
  giving the URL it went out at. A skill teaches where rules live and how a
  unit is published; the seed holds one existing rule, the topic and the
  drafted unit (the schemas are the plugin's own).

  Exercises all three of the plugin's guards: content-rule-is-grounded
  (every RULE.md write cites the user — require, unconditional — and a judge
  checks the rule says what they said), unit-publish-approved (a user
  citation required when the unit enters published, plus published_urls),
  and unit-satisfies-rules (a judge weighs the unit against every rule that
  applies to its tags, the new one included).

  Scored on TRAJECTORY HEALTH (plan-2026-09-24): refusals the agent recovers
  from within a cycle or two are the system working. Which grounded writes
  landed, and which guards fired, are informational rows.
seed: seed
overlay: overlay
plugins: [sloprail-content]
model: haiku
score: score.sh
