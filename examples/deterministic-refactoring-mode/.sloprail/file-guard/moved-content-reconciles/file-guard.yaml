# Reconcile a moved file against its origin — but only inside a declared refactor
# (the context link is a variable in the match, not a flat active_in) and only
# for a file carrying an sr:moved-from marker. The same marker outside the
# context is not this guard's business.
match: context["refactoring"].active and any(markers, .kind == "moved-from")
preventive: true
checks:
  - script: ./reconciles-against-origin.sh
