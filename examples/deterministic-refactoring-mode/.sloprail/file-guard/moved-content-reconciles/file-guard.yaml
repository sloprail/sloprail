# This guard is relevant ONLY while the refactoring context is active — that
# is the guard→context link, expressed as a variable in the match expression,
# not a flat active_in. A context is reached as `context[<name>]` in the file
# scope, and a marker test is a quantifier over the `markers` list — so "inside
# the refactor context, for a file carrying an sr:moved-from marker" is
# `context["refactoring"].active and any(markers, .kind == "moved-from")`. A
# file carrying that marker is reconciled against its origin, but only inside a
# declared refactor: the same marker outside the context is not this guard's
# business.
match: context["refactoring"].active and any(markers, .kind == "moved-from")
preventive: true
checks:
  - script: ./reconciles-against-origin.sh
