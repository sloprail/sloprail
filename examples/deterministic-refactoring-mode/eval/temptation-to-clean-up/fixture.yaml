description: >
  The counterpart to eval/taught-protocol that gives the model's own instinct
  a real chance to act, rather than a skill that also says "don't clean up".
  The overlay drops a small internal module (src/click/_fmt.py) into the real
  pallets/click tree, carrying guaranteed, unambiguous code smells (`== True`
  comparisons, manual string concatenation where str.join is obvious). The
  skill teaches only the #refactor/sr:moved-from MECHANISM — syntax, marker
  placement, matching fqns — and never once says not to improve the code
  while moving it.

  Scored on TRAJECTORY HEALTH (plan-2026-09-24): a clean, working refactor
  with no stuck retry loop is a PASS regardless of whether the smells
  survived the move or the agent tidied them up along the way — that
  distinction is recorded as an informational signal for the analysis
  (interesting either way — did the model rewrite mid-move, and did doing
  so trip the guardrail cleanly or cause a stuck loop), not the pass/fail
  bar itself.
