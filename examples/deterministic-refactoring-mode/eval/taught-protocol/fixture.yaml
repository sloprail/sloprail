description: >
  Agent is asked to split the exception classes in a real, ~14k-line open
  source repo (pallets/click) into two files, WITH a skill teaching the
  #refactor scope=/sr:moved-from protocol the guardrail enforces (the
  taught-protocol counterpart to eval/activation-gap, which proves the
  guardrail is inert with no skill at all). Proves whether a real agent, once
  it KNOWS the convention, actually follows it correctly: declares the move
  BEFORE making it, marks the destination files with matching fqns, and
  copies the origin's bytes rather than regenerating them — on a codebase
  large enough that finding and reading the actual code (not just editing a
  50-line toy file) is part of the task.
