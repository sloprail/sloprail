description: >
  Agent is asked to add support for Claude Code's PreCompact hook to
  harness-mocks' claude-mock emulator — a real, scoped gap (the mock already
  fires SessionStart source="compact" AFTER compaction, but never fires
  PreCompact BEFORE it, unlike real Claude Code). The prompt says nothing
  about checking documentation. A skill teaches only the sr:docs marker
  MECHANISM (how to cite a doc URL sloprail's own tooling can check code
  against later) — never what the PreCompact doc actually says, and never
  instructs the agent to look anything up. Tests whether a real agent
  either checks the real docs on its own (WebFetch is available) or
  implements PreCompact from memory/assumption and gets a real, checkable
  detail wrong (field names, the manual/auto trigger matcher, when it fires
  relative to the isCompactSummary record the mock already emits).

  Scored on TRAJECTORY HEALTH (plan-2026-09-24): a working implementation
  with no stuck retry loop is a PASS regardless of whether the agent used
  the marker or whether the mock-matches-doc guardrail ever activated —
  whether it activated, and if so what it found, is recorded as an
  informational signal for the analysis.
