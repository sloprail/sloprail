# A mock/emulator must follow the SAME contracts as the real thing. Code is
# annotated with an sr:docs marker naming the real doc's URL — mirroring the
# a10n-cli convention of citing a doc section with `a10n:docs <URL>` in a
# comment, spelled as an sr: marker so sloprail's own tooling can bind a rule
# to it. The marker's fqn is a REMOTE URL; the judge fetches it itself.
# A file-guard judges a committed changeset: `markers` are the markers the file
# carries at head, so a file that has one is in `changeset.files`.
match: any(markers, .kind == "docs")
checks:
  - judge: ./code-conforms-to-linked-doc.md.j2
    # The judge reads the doc's RAW text: Claude Code's docs serve each page as
    # markdown at its path + `.md`, so the judge runs exactly
    # `curl -sL https://code.claude.com/docs/<page>.md` and pipes it into grep
    # or head. No WebFetch: it returns another model's summary of the page, not
    # the page — in real runs (2026-09-27) judges quoted fields and rules the
    # hooks page never states (a `compact_reason` field, "PreCompact cannot
    # block") and re-fetched it 10-30 times each until they ran out of time —
    # and an unscoped WebFetch to a URL the judged agent wrote, by a judge that
    # can read the project, is a way to send the project out. A marker citing
    # a doc on another host is refused as one this rule cannot read.
    #
    # The curl grant is PINNED: this command, these flags, this host, one URL.
    # The deny takes back any extra word after the URL (claude's `*` crosses
    # spaces), which is what closes curl's writing and uploading options.
    # Measured through sr-agent (claude 2.1.282, haiku): the fetch piped into
    # grep/head ran; `-o` (into the project, /tmp, attached), `-O`, `-sLo`,
    # `--output`, `-d @`, `-T`, `-F @`, `-H @`, a second URL, `$(...)` in the
    # URL, `>` redirection and every other host were refused. A deny list over
    # an unpinned Bash(curl:*) was measured to leak (`-sLo`, `--etag-save`,
    # `--stderr`, ...), so the pin is the confinement, not the deny list alone.
    #
    # No sed or awk: `sed -n 'w <file>'` and `awk '... > "<file>"'` each wrote
    # a file under their Bash(...:*) grants. grep and head cannot write.
    allowed_tools:
      - "Bash(curl -sL https://code.claude.com/docs/*)"
      - "Bash(grep:*)"
      - "Bash(head:*)"
    disallowed_tools:
      - "Bash(curl -sL https://code.claude.com/docs/* *)"
