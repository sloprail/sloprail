# A mock/emulator must follow the SAME contracts as the real thing. Code is
# annotated with an sr:conforms-to-doc marker naming the real doc's URL. The
# marker's fqn is a REMOTE URL, not a local path, so no `prepare` fetches it
# ahead of time; the judge template gets the URL and visits it directly, the
# way a person checking this by hand would.
match: any(markers, .kind == "conforms-to-doc")
checks:
  - judge: ./code-conforms-to-linked-doc.md.j2
