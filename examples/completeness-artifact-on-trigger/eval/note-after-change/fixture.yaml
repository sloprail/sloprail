description: >
  Agent is asked to fix a small, real bug in a seeded project, WITH a skill
  teaching this repo's own #update/#decision/#skip tag+artifact convention
  the guardrail enforces (every turn must declare one, and #update/#decision
  each require a matching note file written in the same turn).

  Scored on TRAJECTORY HEALTH (plan-2026-09-24), not on whether the agent
  used the tag convention: a clean, working fix with no stuck retry loop is
  a PASS whether or not the agent declared a tag or wrote a note. Whether
  the gates fired, and whether a tag/artifact was ever produced, are
  recorded as secondary, informational signals from a real run — not the
  bar itself.
seed: seed
overlay: overlay
model: haiku
score: score.sh
