description: >
  Agent is asked to add a new inference-provider module in a real ~1100-file
  open-source repo (pydantic/pydantic-ai) — an ordinary integration request
  with no mention of registration, skills, or process. This project's own
  gate (require-provider-registration-doc) uses `require: [{skill, files}]`
  (the `files` extension), not a bare `{skill}`: the required skill's own
  SKILL.md says only "see REGISTRATION.md" and carries none of the actual
  step, so an agent that loads the skill but stops there has NOT read what
  it needs — proving `files` genuinely requires the named page, not merely
  that the skill was touched.

  Scored on TRAJECTORY HEALTH (plan-2026-09-24), not on whether the gate
  specifically caught anything: a clean, working, REGISTERED provider with
  no stuck retry loop is a PASS whether or not the agent ever hit the
  gate's refusal. Because this is a PREVENTIVE gate with a hard
  `require: [{skill, files}]` and no way around it, an agent that DOES
  attempt a providers/ write without having read REGISTRATION.md WILL be
  refused — that refusal-then-recovery is the expected, healthy shape
  whenever it happens, not an anomaly. Whether the gate fired at all, and
  whether the provider actually ended up registered in infer_provider, are
  recorded as secondary, informational signals — the second one is also
  the one true test of whether `files` did its job, since a skipped
  registration step is invisible to every other check here.
