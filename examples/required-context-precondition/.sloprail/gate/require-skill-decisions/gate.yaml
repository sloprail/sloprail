# Writing under memories/decisions/ is blocked until document-strategy was
# loaded. A separate gate rather than a second entry in the topics one, because
# `require` binds to the whole gate — which prefix demands which skill is the
# structure, not a lookup a single gate's checks would carry. Two gates instead
# of one script with an internal prefix→skill table.
on:
  - event: PreFileCreate
    match: path startsWith "memories/decisions/"
  - event: PreFileUpdate
    match: path startsWith "memories/decisions/"
require:
  - skill: document-strategy
