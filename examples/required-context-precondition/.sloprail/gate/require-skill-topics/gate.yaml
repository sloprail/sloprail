# Writing under memories/topics/ is blocked until document-topic was loaded
# this session. No script: `require` is the whole rule. Two events, one match
# each, because a topic file arrives as a create or an update — the same reason
# a file-guard binds both.
on:
  - event: PreFileCreate
    match: path startsWith "memories/topics/"
  - event: PreFileUpdate
    match: path startsWith "memories/topics/"
require:
  - skill: document-topic
