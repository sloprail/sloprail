# The structure-gate primitive (decision 20260818_no-slop-primitives, #08),
# incorporated into this example rather than given its own (no content unit
# names structure gate as ITS own use case — several units' taxonomy lists
# name "structure" as a distinct rule kind alongside conformance/
# completeness/precondition/etc, but none of the 17 is that kind itself).
#
# His pick for where to show it: this example already gates memories/topics/
# and memories/decisions/ on a loaded skill — the exact two prefixes the
# LIVE PROTOTYPE this unit is named for (enforce-structure.sh) hard-coded.
# structure.yaml adds the coarser boundary that hook never had: nothing
# OUTSIDE memories/ is writable at all, deny by default — a project-wide
# allowlist, not a second precondition on the same two prefixes.
#
# Only memories/ itself is allowed broadly; the two gated prefixes stay
# gated by their own require: this file does not replace or duplicate
# require-skill-topics/require-skill-decisions — a path can be inside the
# allowlist here and STILL blocked by a gate that fires on it. The two
# primitives compose rather than overlap: this settles "is writing here
# allowed at all", the gates settle "is the required context loaded first".
paths:
  - "memories/**"
