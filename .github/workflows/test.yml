# Tests on every push and every pull request.
#
# Two jobs rather than one, mirroring the Makefile's own split: a failure in the
# fast half is reported in seconds instead of after the slow half finishes. They
# run in parallel, so the wall clock is the e2e job either way.
name: test

# push only. A pull_request trigger as well would run every job TWICE on any
# branch that has one open — the same commit, the same result, twice the wall
# clock and twice the runner minutes.
on:
  push:

# OIDC, to download the published claude-mock from GCP Artifact Registry without
# a long-lived key in this repo. Mirrors a10n's own test workflow.
permissions:
  contents: read
  id-token: write

env:
  # Where a10n-cli publishes a10n-claude-mock. Its CI service account can read
  # it, and the harness resolves the mock from PATH — sloprail builds its own
  # binaries, so the mock is the only thing that has to be fetched.
  GCP_PROJECT_ID: horizon-37
  GCP_REGISTRY_LOCATION: europe-west3
  GCP_REPOSITORY: h37-agent-factory-dev-a10n-cli
  WORKLOAD_IDENTITY_PROVIDER: projects/202350853882/locations/global/workloadIdentityPools/h37-agent-factory-dev-gh/providers/gh-oidc
  SERVICE_ACCOUNT: a10n-cli-ci@horizon-37.iam.gserviceaccount.com

# A second push to the same branch cancels the first. The old run is answering a
# question about code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit + services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Reported as its own step: a formatting complaint is not a test failure
      # and reading it as one wastes the reader's first guess.
      # `gofmt -l .` walks the tree, and .gitignore does not stop it — an agent
      # worktree under .claude/ is a second copy of this repository, so every
      # file would be reported twice with a path that is not ours. Asking git
      # which files it tracks is the same question with the right answer.
      - name: gofmt
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: unit
        run: make test-unit

      - name: services
        run: make test-services

  e2e:
    name: e2e (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # The e2e suite runs -p 1 (one test binary at a time — a disk-space
    # constraint, see the Makefile), which made the whole suite a single long
    # serial job. As the corpus of use-case e2e grew it stopped finishing inside
    # the runner's usable wall-clock, so it is SHARDED here: each matrix leg runs
    # a disjoint slice of ./tests/... (still -p 1, so disk stays low) in parallel.
    # The shard names below MUST match the Makefile's test-e2e-shard cases, whose
    # union is exactly `go list ./tests/...` — a slice named here but not there
    # (or vice versa) drops packages from CI silently.
    strategy:
      fail-fast: false
      matrix:
        shard: [session, session2, pre_tool, examples, rest]
    # 45, against the suite's own 30m: the gap absorbs the checkout, the module
    # download and the per-package binary builds, so a job killed here means the
    # shard genuinely hung rather than the runner being slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # git is the subject of the change-detection half — every baseline, every
      # tree diff. A runner with no identity fails those with a message about
      # committing rather than about the engine.
      - name: git identity
        run: |
          git config --global user.email ci@sloprail.invalid
          git config --global user.name  sloprail CI

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Versions are YYYYMMDD-<shortsha> with no "latest" tag, so the newest is
      # taken by update time. Copied from a10n's own workflow rather than
      # reinvented, since it is the same artifact from the same registry.
      - name: install a10n-claude-mock
        run: |
          PKG=a10n-claude-mock
          VERSION=$(gcloud artifacts versions list \
            --project=${{ env.GCP_PROJECT_ID }} \
            --location=${{ env.GCP_REGISTRY_LOCATION }} \
            --repository=${{ env.GCP_REPOSITORY }} \
            --package="${PKG}" \
            --sort-by="~UPDATE_TIME" --limit=1 --format="value(VERSION)")
          echo "downloading ${PKG} @ ${VERSION}"
          gcloud artifacts generic download \
            --project=${{ env.GCP_PROJECT_ID }} \
            --location=${{ env.GCP_REGISTRY_LOCATION }} \
            --repository=${{ env.GCP_REPOSITORY }} \
            --package="${PKG}" --version="${VERSION}" --destination=/tmp/
          cp "/tmp/${PKG}-linux-amd64/${PKG}-linux-amd64" "/tmp/${PKG}"
          chmod +x "/tmp/${PKG}"
          echo "/tmp" >> "${GITHUB_PATH}"

      # The suite SKIPS every package when the mock is absent, and a skipped
      # package reports ok — 56 packages "passing" in 38 seconds against ~30
      # minutes locally. A green run that tested nothing is worse than a red one
      # because it is trusted, so the absence is made loud rather than silent.
      - name: e2e
        run: |
          command -v a10n-claude-mock >/dev/null 2>&1 || {
            echo "a10n-claude-mock is not on PATH — every e2e package would SKIP"
            echo "and report ok. Failing instead of running nothing."
            exit 1
          }
          make test-e2e-shard SHARD=${{ matrix.shard }}
