# Tests on every push and every pull request.
#
# Two jobs rather than one, mirroring the Makefile's own split: a failure in the
# fast half is reported in seconds instead of after the slow half finishes. They
# run in parallel, so the wall clock is the e2e job either way.
name: test

# push only. A pull_request trigger as well would run every job TWICE on any
# branch that has one open — the same commit, the same result, twice the wall
# clock and twice the runner minutes.
# The paths are the code and the tests. test-skipped.yml holds the opposite list and
# reports the required checks for a push this one does not run on: keep the two in step.
on:
  push:
    paths:
      - '**.go'
      - go.mod
      - go.sum
      - Makefile
      - install.sh
      - 'internal/**'
      - 'services/**'
      - 'tests/**'
      - 'tools/**'
      - 'scripts/**'
      - 'marketplace/**'
      - .github/workflows/test.yml
      # a release's version bump is not code
      - '!marketplace/plugins/*/.*-plugin/plugin.json'
  # Everything on any branch, on demand, the Codex and Cursor suites included:
  # `gh workflow run test --ref <branch>`.
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch cancels the first. The old run is answering a
# question about code nobody will merge. A dispatched full run is never cancelled
# (its own group, by run id): it answers for the commit it started on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'push' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # changes reads the head commit for an [e2e-only: ...] tag. Such a commit runs only
  # the e2e-adhoc job below; every other job's steps skip.
  changes:
    name: what to run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # An [e2e-only: ...] commit runs ONLY the e2e-adhoc job below (every other
    # job's steps skip) — see the adhoc step.
    outputs:
      code-changed: ${{ steps.adhoc.outputs.adhoc != 'true' }}
      adhoc: ${{ steps.adhoc.outputs.adhoc }}
      adhoc-harness: ${{ steps.adhoc.outputs.harness }}
      adhoc-pkgs: ${{ steps.adhoc.outputs.pkgs }}
      adhoc-run: ${{ steps.adhoc.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: adhoc
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          line="$(printf '%s\n' "$MSG" | grep -oE '\[e2e-only:[^]]*pkgs=[^]]*\]' | tail -1 || true)"
          if [ -z "$line" ]; then echo "adhoc=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          body="${line#\[e2e-only:}"; body="${body%\]}"
          harness=claude pkgs='' run=''
          for kv in $body; do
            case "$kv" in
              harness=*) harness="${kv#harness=}" ;;
              pkgs=*) pkgs="$(printf '%s' "${kv#pkgs=}" | tr ',' ' ')" ;;
              run=*) run="${kv#run=}" ;;
              *) echo "[e2e-only]: unknown field '$kv' (want harness=, pkgs=, run=)" >&2; exit 1 ;;
            esac
          done
          case "$harness" in claude|codex|cursor) ;; *) echo "[e2e-only]: harness must be claude, codex or cursor" >&2; exit 1 ;; esac
          [ -n "$pkgs" ] || { echo "[e2e-only]: pkgs= is required" >&2; exit 1; }
          case "$pkgs" in *[!a-zA-Z0-9_./\ -]*) echo "[e2e-only]: pkgs takes package paths only" >&2; exit 1 ;; esac
          if printf '%s' "$run" | grep -q '[^a-zA-Z0-9_|^$.*()/-]'; then echo "[e2e-only]: run takes a go test -run regex only" >&2; exit 1; fi
          { echo "adhoc=true"; echo "harness=$harness"; echo "pkgs=$pkgs"; echo "run=$run"; } >> "$GITHUB_OUTPUT"

  unit:
    name: unit + services
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Skipped via a per-STEP if:, not a job-level one, on this job alone
      # (unit/install-sh have no matrix, so this line has to say it every
      # step) — see the e2e job's own comment for why the job-level form is
      # wrong for any job whose name is REQUIRED by main's ruleset.
      - if: needs.changes.outputs.code-changed == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code-changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Required by tests (tests/repo, grounding e2e): they fail, not skip, without them.
      - if: needs.changes.outputs.code-changed == 'true'
        name: install jq and yq
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq
          command -v yq >/dev/null || {
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }

      - if: needs.changes.outputs.code-changed == 'true'
        name: build
        run: go build ./...

      - if: needs.changes.outputs.code-changed == 'true'
        name: vet
        run: go vet ./...

      # Reported as its own step: a formatting complaint is not a test failure
      # and reading it as one wastes the reader's first guess.
      # `gofmt -l .` walks the tree, and .gitignore does not stop it — an agent
      # worktree under .claude/ is a second copy of this repository, so every
      # file would be reported twice with a path that is not ours. Asking git
      # which files it tracks is the same question with the right answer.
      - if: needs.changes.outputs.code-changed == 'true'
        name: gofmt
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - if: needs.changes.outputs.code-changed == 'true'
        name: unit
        run: make test-unit

      - if: needs.changes.outputs.code-changed == 'true'
        name: services
        run: make test-services

  e2e:
    name: e2e (${{ matrix.shard }})
    needs: changes
    # NOT a job-level if:. A job-level if: on a job with a matrix: strategy
    # skips the matrix EXPANSION itself when false — GitHub reports one job
    # named literally "e2e (${{ matrix.shard }})" (the unexpanded template
    # string), never the 6 real "e2e (session)" / "e2e (rest)" / etc. names
    # main's ruleset actually requires. Those 6 required contexts then never
    # report AT ALL for that commit, and the PR is blocked exactly as if the
    # checks had failed — worse, actually, since a failed check can be seen
    # and re-run, while a check stuck at "expected" looks identical to CI
    # still running, forever. Caught by actually running it: PR #56's
    # version-only bump PR sat BLOCKED with 5 checks reported instead of 9.
    # So the if: moves onto every STEP below instead, which still runs a real
    # job per shard (matrix always expands), each one just skipping its own
    # work and reporting success in a few seconds — the same trick applied to
    # the `unit` and `install-sh` jobs, which don't have this failure mode
    # (no matrix to fail to expand) but get the identical treatment for
    # consistency and because a job-level if: still LOOKS safe there today,
    # right up until a matrix: is added to one of them later.
    runs-on: ubuntu-latest
    # The e2e suite runs -p 1 (one test binary at a time — a disk-space
    # constraint, see the Makefile), which made the whole suite a single long
    # serial job. As the corpus of use-case e2e grew it stopped finishing inside
    # the runner's usable wall-clock, so it is SHARDED here: each matrix leg runs
    # a disjoint slice of ./tests/... (still -p 1, so disk stays low) in parallel.
    # The shard names below MUST match the Makefile's test-e2e-shard cases, whose
    # union is exactly `go list ./tests/...` — a slice named here but not there
    # (or vice versa) drops packages from CI silently.
    strategy:
      fail-fast: false
      matrix:
        shard: [session, session2, pre_tool, rest, rest2, rest3, rest4, plugins]
    # 45, against the suite's own 30m: the gap absorbs the checkout, the module
    # download and the per-package binary builds, so a job killed here means the
    # shard genuinely hung rather than the runner being slow.
    timeout-minutes: 45
    steps:
      - if: needs.changes.outputs.code-changed == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code-changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Required by tests (tests/repo, grounding e2e): they fail, not skip, without them.
      - if: needs.changes.outputs.code-changed == 'true'
        name: install jq and yq
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq
          command -v yq >/dev/null || {
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }

      # The mocks the e2e suites drive, at the versions pinned in
      # tests/e2e/harness/{MOCK,CODEX_MOCK,CURSOR_MOCK}_VERSION — the same
      # `make mock` a contributor runs, built from source (harness-mocks is
      # public), so CI and local agree and a mock bump is a reviewed change.
      - if: needs.changes.outputs.code-changed == 'true'
        name: install the mocks
        run: make mock

      # Checked here as well as by the harness (which installs a missing pinned
      # mock itself and fails if it cannot): a broken install step stops the job
      # at once rather than inside every package.
      - if: needs.changes.outputs.code-changed == 'true'
        name: e2e
        run: |
          test -x .bin/a10n-claude-mock || {
            echo "a10n-claude-mock is not in .bin/ — the install step above did not leave it."
            exit 1
          }
          make test-e2e-shard SHARD=${{ matrix.shard }}

  # One stable name for branch protection to require, however the shard list
  # changes. always(): a failed or cancelled shard must fail THIS job rather
  # than leave it skipped (a skipped required check counts as passing).
  # Every matrix leg reports success even when changes found nothing to test
  # (its steps skip, the job does not), so the only legitimate non-success is
  # the e2e job itself skipped because the changes job was.
  e2e-all:
    name: e2e (all)
    needs: [changes, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code-changed }}
          ADHOC: ${{ needs.changes.outputs.adhoc }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "changes=$CHANGES code-changed=$CODE_CHANGED adhoc=$ADHOC e2e=$E2E"
          [ "$CHANGES" = success ] || { echo "the what-to-run job did not succeed"; exit 1; }
          [ "$ADHOC" != true ] || { echo "an [e2e-only] commit ran a subset only: push a commit without the tag for the full run"; exit 1; }
          [ "$E2E" = success ] && exit 0
          if [ "$E2E" = skipped ] && [ "$CODE_CHANGED" != true ]; then exit 0; fi
          echo "an e2e shard did not succeed"
          exit 1

  # The same e2e shards against OpenAI Codex (SR_HARNESS=codex, a10n-codex-mock),
  # to watch the pass count move as Codex support lands. Allowed to fail, and NOT
  # part of `e2e (all)`: nothing requires it. Steps a Codex run cannot take (no
  # skill tool, no worktree isolation, ...) skip, naming the step; the rest pass
  # or fail on what Codex support does today. `plugins` is left out: those modules
  # drive the Claude mock. The shards must stay a subset of the Makefile's (the
  # guard in tests/repo checks it).
  # Runs on a main push or a dispatched full run only (each step's if:). On a branch, drive Codex or Cursor with an
  # [e2e-only: harness=codex|cursor pkgs=... run=...] commit (e2e-adhoc), which runs
  # just the chosen packages instead of 14 full shards on every push.
  e2e-codex:
    name: e2e codex (${{ matrix.codex-shard }})
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        codex-shard: [session, session2, pre_tool, rest, rest2, rest3, rest4]
    timeout-minutes: 45
    steps:
      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Required by tests (tests/repo, grounding e2e): they fail, not skip, without them.
      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        name: install jq and yq
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq
          command -v yq >/dev/null || {
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }

      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        name: install the mocks
        run: make mock
      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        name: e2e (codex)
        shell: bash
        env:
          SR_HARNESS: codex
          GOFLAGS: -v
        run: |
          test -x .bin/a10n-codex-mock || { echo "a10n-codex-mock is not in .bin/"; exit 1; }
          set +e
          make test-e2e-shard SHARD=${{ matrix.codex-shard }} 2>&1 | tee codex-e2e.log
          status=${PIPESTATUS[0]}
          pass=$(grep -c '^--- PASS' codex-e2e.log); fail=$(grep -c '^--- FAIL' codex-e2e.log); skip=$(grep -c '^--- SKIP' codex-e2e.log)
          echo "codex ${{ matrix.codex-shard }}: pass=$pass fail=$fail skip=$skip" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  # The same e2e shards against Cursor (SR_HARNESS=cursor, a10n-cursor-mock). Allowed to
  # fail and not part of `e2e (all)`, like the Codex leg: steps Cursor cannot take skip,
  # naming the step. No examples shards (they move to sloprail-community). The shards
  # must stay a subset of the Makefile's (the guard in tests/repo checks it).
  e2e-cursor:
    name: e2e cursor (${{ matrix.cursor-shard }})
    needs: changes
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        cursor-shard: [session, session2, pre_tool, rest, rest2, rest3, rest4]
    timeout-minutes: 45
    steps:
      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Required by tests (tests/repo, grounding e2e): they fail, not skip, without them.
      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        name: install jq and yq
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq
          command -v yq >/dev/null || {
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }

      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        name: install the mocks
        run: make mock
      - if: needs.changes.outputs.code-changed == 'true' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        name: e2e (cursor)
        shell: bash
        env:
          SR_HARNESS: cursor
          GOFLAGS: -v
        run: |
          test -x .bin/a10n-cursor-mock || { echo "a10n-cursor-mock is not in .bin/"; exit 1; }
          set +e
          make test-e2e-shard SHARD=${{ matrix.cursor-shard }} 2>&1 | tee cursor-e2e.log
          status=${PIPESTATUS[0]}
          pass=$(grep -c '^--- PASS' cursor-e2e.log); fail=$(grep -c '^--- FAIL' cursor-e2e.log); skip=$(grep -c '^--- SKIP' cursor-e2e.log)
          echo "cursor ${{ matrix.cursor-shard }}: pass=$pass fail=$fail skip=$skip" | tee -a "$GITHUB_STEP_SUMMARY"
          exit $status

  # install-sh proves the stranger install path works, on every push — not only
  # on a tagged release. It builds real release archives (make release, the
  # same target .github/workflows/release.yml uses) and runs install.sh against
  # them served from a local HTTP server, so a regression in either the archive
  # shape or the script's download/verify/unpack logic fails CI instead of
  # surfacing on the next actual release, which is what the smoke test in the
  # strategy repo's distribution/soft-launch-pain-priorities task found missing
  # entirely.
  install-sh:
    name: install.sh (stranger install path)
    needs: changes
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      # Per-step if:, not job-level — see the e2e job's own comment for why:
      # this job has no matrix today, so a job-level if: would not break its
      # required-check NAME the way it does there, but the same mistake is
      # one `matrix:` away from happening here too, so every job in this file
      # is held to the per-step form for the one property that actually
      # matters — the job's OWN name always reports, skip or not.
      - if: needs.changes.outputs.code-changed == 'true'
        uses: actions/checkout@v4
      - if: needs.changes.outputs.code-changed == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - if: needs.changes.outputs.code-changed == 'true'
        name: shellcheck
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck install.sh marketplace/plugins/sloprail/hooks/sr-session-hook.sh

      - if: needs.changes.outputs.code-changed == 'true'
        name: build release archives
        run: make release

      - if: needs.changes.outputs.code-changed == 'true'
        name: serve the archives like a GitHub Release would
        run: |
          python3 -m http.server 8931 --directory dist --bind 127.0.0.1 &
          echo $! > /tmp/http-server.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8931/checksums.txt >/dev/null 2>&1 && break
            sleep 0.5
          done

      # The real install.sh, unmodified, pointed at the local server instead of
      # GitHub via SLOPRAIL_RELEASE_URL — proving the SHIPPED script's
      # download → checksum verify → unpack → install sequence actually works,
      # not a rewritten stand-in.
      # jq/yq: with neither on PATH (a PATH of basic tools only) and no package manager
      # allowed, install.sh puts static binaries (here local stand-ins) in the install dir.
      - if: needs.changes.outputs.code-changed == 'true'
        name: install.sh installs jq and yq
        run: |
          sandbox="$RUNNER_TEMP/tools-sandbox"; mkdir -p "$sandbox/bin" "$sandbox/src" "$sandbox/dest"
          for t in uname mktemp curl id cp chmod mkdir rm cat tr dirname grep awk sed; do ln -s "$(command -v $t)" "$sandbox/bin/$t"; done
          printf '#!/bin/sh\necho jq-stand-in\n' > "$sandbox/src/jq"; printf '#!/bin/sh\necho yq-stand-in\n' > "$sandbox/src/yq"
          cp install.sh /tmp/install-tools-under-test.sh
          env -i HOME="$sandbox" PATH="$sandbox/bin" SLOPRAIL_TOOLS_NO_PM=1 SLOPRAIL_JQ_URL="file://$sandbox/src/jq" SLOPRAIL_YQ_URL="file://$sandbox/src/yq" /bin/sh /tmp/install-tools-under-test.sh --tools-only "$sandbox/dest"
          test -x "$sandbox/dest/jq" && test -x "$sandbox/dest/yq"
          if env -i HOME="$sandbox" PATH="$sandbox/bin" SLOPRAIL_TOOLS_NO_PM=1 SLOPRAIL_YQ_URL="file://$sandbox/none" /bin/sh /tmp/install-tools-under-test.sh --tools-only "$sandbox/dest2"; then echo "a missing download was not an error"; exit 1; fi

      - if: needs.changes.outputs.code-changed == 'true'
        name: run install.sh end to end
        run: |
          cp install.sh /tmp/install-under-test.sh
          chmod +x /tmp/install-under-test.sh
          # SLOPRAIL_INSTALL_TAG skips the real GitHub "latest" redirect
          # resolution — the local server above serves flat files with no
          # GitHub-shaped redirect to resolve, and a stranger's CI run has
          # no auth to reach a private repo's real release anyway. The value
          # is arbitrary; this test's mock doesn't care which tag it says.
          SLOPRAIL_RELEASE_URL="http://127.0.0.1:8931" SLOPRAIL_INSTALL_TAG="v0.0.0-ci-mock" SLOPRAIL_INSTALL_DIR="$RUNNER_TEMP/sloprail-installed" /tmp/install-under-test.sh

      - if: needs.changes.outputs.code-changed == 'true'
        name: installed binaries actually run
        run: |
          "$RUNNER_TEMP/sloprail-installed/sr-session" start </dev/null >/dev/null
          echo "sr-session runs after install.sh"

      # --harness: the flag picks what gets set up beyond the binaries. cursor-agent needs a
      # login, so CI cannot run it; what it can prove is that the plugin lands where Cursor
      # loads local plugins from, whole and executable, and that its hook runs against the
      # installed binaries and answers in the JSON Cursor requires.
      - if: needs.changes.outputs.code-changed == 'true'
        name: install.sh --harness cursor
        run: |
          export SLOPRAIL_RELEASE_URL="http://127.0.0.1:8931" SLOPRAIL_INSTALL_TAG="v0.0.0-ci-mock" SLOPRAIL_INSTALL_DIR="$RUNNER_TEMP/sloprail-cursor-bin"
          export SLOPRAIL_HARNESS_MOCK_URL="http://127.0.0.1:8931/none"
          if HOME="$RUNNER_TEMP/bogus-home" /tmp/install-under-test.sh --harness bogus; then echo "an unknown harness id was accepted"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/binonly-home" "$RUNNER_TEMP/cursor-home"
          HOME="$RUNNER_TEMP/binonly-home" /tmp/install-under-test.sh --binaries-only
          if [ -e "$RUNNER_TEMP/binonly-home/.cursor" ]; then echo "--binaries-only touched ~/.cursor"; exit 1; fi
          HOME="$RUNNER_TEMP/cursor-home" /tmp/install-under-test.sh --harness cursor
          plugin="$RUNNER_TEMP/cursor-home/.cursor/plugins/local/sloprail"
          test -f "$plugin/.cursor-plugin/plugin.json"
          test -x "$plugin/hooks/sr-session-hook-cursor.sh"
          test -f "$plugin/.claude-plugin/plugin.json"
          # Cursor runs a plugin hook from the plugin's directory with CURSOR_PLUGIN_ROOT set.
          out="$(cd "$plugin" && CURSOR_PLUGIN_ROOT="$plugin" PATH="$RUNNER_TEMP/sloprail-cursor-bin:$PATH" SLOPRAIL_NO_AUTO_INSTALL=1 ./hooks/sr-session-hook-cursor.sh start </dev/null)"
          printf '%s\n' "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["additional_context"]'
          echo "cursor plugin installed and its sessionStart hook answers"

      - if: needs.changes.outputs.code-changed == 'true'
        name: tampered download is rejected
        run: |
          cp dist/sloprail-darwin-arm64.tar.gz /tmp/original.tar.gz
          printf 'corruption' >> dist/sloprail-darwin-arm64.tar.gz
          rm -rf "$RUNNER_TEMP/sloprail-tampered"
          if SLOPRAIL_RELEASE_URL="http://127.0.0.1:8931" SLOPRAIL_INSTALL_TAG="v0.0.0-ci-mock" SLOPRAIL_INSTALL_DIR="$RUNNER_TEMP/sloprail-tampered" /tmp/install-under-test.sh; then
            echo "install.sh accepted a tampered archive — checksum verification is broken"
            exit 1
          fi
          echo "tampered archive was correctly rejected"
          cp /tmp/original.tar.gz dist/sloprail-darwin-arm64.tar.gz

      # needs.changes.outputs.code-changed == 'true' is ANDed into this one's
      # own always(): always() alone would try to kill a server this run
      # never started when the job was skipped, which is harmless (the `||
      # true` swallows it) but pointless — the AND just keeps the log free of
      # a step that visibly "ran" a no-op on every skipped push.
      - if: always() && needs.changes.outputs.code-changed == 'true'
        name: stop local server
        run: kill "$(cat /tmp/http-server.pid)" 2>/dev/null || true

  # The [e2e-only: ...] subset (see the changes job's adhoc step). Not required;
  # e2e (all) fails for such a commit regardless of this job's result.
  e2e-adhoc:
    name: e2e adhoc
    needs: changes
    if: needs.changes.outputs.adhoc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install jq and yq
        run: |
          command -v jq >/dev/null || sudo apt-get install -y jq
          command -v yq >/dev/null || {
            sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }
      - name: install the mocks
        run: make mock
      - name: e2e (${{ needs.changes.outputs.adhoc-harness }})
        shell: bash
        env:
          SR_HARNESS: ${{ needs.changes.outputs.adhoc-harness }}
          PKGS: ${{ needs.changes.outputs.adhoc-pkgs }}
          RUN: ${{ needs.changes.outputs.adhoc-run }}
        run: |
          set +e
          # shellcheck disable=SC2086
          go test -p 1 -count=1 -timeout 40m -v ${RUN:+-run "$RUN"} $PKGS 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          {
            echo "harness=$SR_HARNESS packages=$PKGS run=${RUN:-all}"
            echo "pass=$(grep -c -- '--- PASS' e2e.log) fail=$(grep -c -- '--- FAIL' e2e.log) skip=$(grep -c -- '--- SKIP' e2e.log)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit "$status"
