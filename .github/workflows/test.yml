# Tests on every push and every pull request.
#
# Two jobs rather than one, mirroring the Makefile's own split: a failure in the
# fast half is reported in seconds instead of after the slow half finishes. They
# run in parallel, so the wall clock is the e2e job either way.
name: test

# push only. A pull_request trigger as well would run every job TWICE on any
# branch that has one open — the same commit, the same result, twice the wall
# clock and twice the runner minutes.
on:
  push:

permissions:
  contents: read

env:
  # sloprail/harness-mocks publishes a10n-claude-mock as GitHub Release
  # assets (claude-mock was extracted there from a10n-cli, which is no
  # longer maintained — see harness-mocks' own README). It is a separate
  # PRIVATE repo, so the default GITHUB_TOKEN (scoped to this repo only)
  # cannot read its releases; HARNESS_MOCKS_TOKEN is a fine-grained PAT with
  # contents:read on sloprail/harness-mocks, added as a repo secret here.
  HARNESS_MOCKS_REPO: sloprail/harness-mocks

# A second push to the same branch cancels the first. The old run is answering a
# question about code nobody will merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # changes decides whether this push touched anything unit/e2e/install-sh
  # could actually catch a regression in. Two kinds of diff are exempt:
  #
  #   - the version files cut-release.yml's bump commit writes (plugin.json/
  #     marketplace.json) — a version string in already-shipped JSON, no Go,
  #     no shell.
  #   - any OTHER workflow file (.github/workflows/*.yml except this one) —
  #     unit/e2e/install-sh exercise Go code and install.sh, not workflow
  #     YAML; a change to release.yml or cut-release.yml is proven (or not)
  #     by actually running IT, which is a different job's concern
  #     (actionlint, or the workflow's own next real run), not by re-running
  #     a test suite that never reads workflow files at all. THIS file
  #     (test.yml) is excluded from that exemption on purpose: a bug in the
  #     job that decides what to skip, or in any job below it, has to be
  #     proven by the very matrix it controls, so a self-change always runs
  #     everything.
  #
  # Either way, code-changed downstream turns "nothing worth testing changed"
  # into a skip: fast, green, and every required context still REPORTS for
  # the commit (a skipped job's conclusion still satisfies a required status
  # check), so a bump or workflow-only PR is never stuck waiting on a check
  # that never ran.
  #
  # Diffed against where this branch FORKED from the default branch (git
  # merge-base), not against github.event.before. before is the all-zeros SHA
  # on a branch's first push — exactly what scripts/cut-release.sh's
  # release/vX.Y.Z branch is EVERY time (a fresh branch off main, one commit)
  # — so treating that as "fail open, assume code changed" defeated the skip
  # for the one case it exists for, discovered by actually running it: PR #54
  # ran the full matrix on a plugin.json-only diff. merge-base answers "what
  # did THIS branch add relative to where it started," which is right for
  # both a brand-new release branch and an ordinary feature branch with
  # several commits — not "does this branch differ from main" via a plain
  # `git diff main...HEAD` (nearly always true the INSTANT a branch exists,
  # for the trivial reason that main itself keeps moving — that question
  # would defeat the skip just as completely, the opposite failure mode).
  changes:
    name: which files changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code-changed: ${{ steps.diff.outputs.code-changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          default_branch="$(git remote show origin | sed -n '/HEAD branch/s/.*: //p')"
          base="$(git merge-base "origin/$default_branch" "${{ github.sha }}")"
          # No merge-base at all (an unrelated-history branch, or the default
          # branch itself force-pushed away from what this checkout knows) —
          # fail open rather than risk skipping real changes on a comparison
          # that cannot mean anything.
          if [ -z "$base" ]; then
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$base" "${{ github.sha }}")"
          # Exempt: the two version files, and any workflow file except this
          # one (test.yml — see the job's own doc comment for why it is the
          # one exception). POSIX grep has no negative lookahead, so rather
          # than one pattern encoding "workflow file, but NOT this specific
          # name", the workflow-file check runs only once test.yml is
          # already known absent from the diff — a changed test.yml must
          # never be filtered out by the broader workflows/*.yml pattern
          # below it, or it would silently exempt itself.
          exempt="$(printf '%s\n' "$changed" | grep -vE '^(marketplace/plugins/[^/]+/\.claude-plugin/plugin\.json|\.claude-plugin/marketplace\.json)$' || true)"
          if printf '%s\n' "$exempt" | grep -qx '\.github/workflows/test\.yml'; then
            other="$exempt"
          else
            other="$(printf '%s\n' "$exempt" | grep -vE '^\.github/workflows/[^/]+\.ya?ml$' || true)"
          fi
          if [ -z "$other" ]; then
            echo "code-changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "code-changed=true" >> "$GITHUB_OUTPUT"
          fi

  unit:
    name: unit + services
    needs: changes
    if: needs.changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      # Reported as its own step: a formatting complaint is not a test failure
      # and reading it as one wastes the reader's first guess.
      # `gofmt -l .` walks the tree, and .gitignore does not stop it — an agent
      # worktree under .claude/ is a second copy of this repository, so every
      # file would be reported twice with a path that is not ours. Asking git
      # which files it tracks is the same question with the right answer.
      - name: gofmt
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - name: unit
        run: make test-unit

      - name: services
        run: make test-services

  e2e:
    name: e2e (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.code-changed == 'true'
    runs-on: ubuntu-latest
    # The e2e suite runs -p 1 (one test binary at a time — a disk-space
    # constraint, see the Makefile), which made the whole suite a single long
    # serial job. As the corpus of use-case e2e grew it stopped finishing inside
    # the runner's usable wall-clock, so it is SHARDED here: each matrix leg runs
    # a disjoint slice of ./tests/... (still -p 1, so disk stays low) in parallel.
    # The shard names below MUST match the Makefile's test-e2e-shard cases, whose
    # union is exactly `go list ./tests/...` — a slice named here but not there
    # (or vice versa) drops packages from CI silently.
    strategy:
      fail-fast: false
      matrix:
        shard: [session, session2, pre_tool, examples, rest, plugins]
    # 45, against the suite's own 30m: the gap absorbs the checkout, the module
    # download and the per-package binary builds, so a job killed here means the
    # shard genuinely hung rather than the runner being slow.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # git is the subject of the change-detection half — every baseline, every
      # tree diff. A runner with no identity fails those with a message about
      # committing rather than about the engine.
      - name: git identity
        run: |
          git config --global user.email ci@sloprail.invalid
          git config --global user.name  sloprail CI

      # Latest Release (not "latest" as a literal tag — `gh release list`
      # sorts by creation time, and harness-mocks' releases are semver
      # (v0.1.0, ...), never a floating tag) — mirrors the old GCP install
      # step's own "newest by update time" resolution, just against Releases
      # instead of Artifact Registry versions.
      - name: install a10n-claude-mock
        env:
          GH_TOKEN: ${{ secrets.HARNESS_MOCKS_TOKEN }}
        run: |
          TAG=$(gh release list --repo "${{ env.HARNESS_MOCKS_REPO }}" \
            --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$TAG" ]; then
            echo "no release found on ${{ env.HARNESS_MOCKS_REPO }}" >&2
            exit 1
          fi
          echo "downloading a10n-claude-mock @ ${TAG}"
          gh release download "$TAG" --repo "${{ env.HARNESS_MOCKS_REPO }}" \
            --pattern 'a10n-claude-mock-linux-amd64' --dir /tmp --clobber
          mv /tmp/a10n-claude-mock-linux-amd64 /tmp/a10n-claude-mock
          chmod +x /tmp/a10n-claude-mock
          echo "/tmp" >> "${GITHUB_PATH}"

      # The suite SKIPS every package when the mock is absent, and a skipped
      # package reports ok — 56 packages "passing" in 38 seconds against ~30
      # minutes locally. A green run that tested nothing is worse than a red one
      # because it is trusted, so the absence is made loud rather than silent.
      - name: e2e
        run: |
          command -v a10n-claude-mock >/dev/null 2>&1 || {
            echo "a10n-claude-mock is not on PATH — every e2e package would SKIP"
            echo "and report ok. Failing instead of running nothing."
            exit 1
          }
          make test-e2e-shard SHARD=${{ matrix.shard }}

  # install-sh proves the stranger install path works, on every push — not only
  # on a tagged release. It builds real release archives (make release, the
  # same target .github/workflows/release.yml uses) and runs install.sh against
  # them served from a local HTTP server, so a regression in either the archive
  # shape or the script's download/verify/unpack logic fails CI instead of
  # surfacing on the next actual release, which is what the smoke test in the
  # strategy repo's distribution/soft-launch-pain-priorities task found missing
  # entirely.
  install-sh:
    name: install.sh (stranger install path)
    needs: changes
    if: needs.changes.outputs.code-changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: shellcheck
        run: |
          brew list shellcheck >/dev/null 2>&1 || brew install shellcheck
          shellcheck install.sh marketplace/plugins/sloprail/hooks/sr-session-hook.sh

      - name: build release archives
        run: make release

      - name: serve the archives like a GitHub Release would
        run: |
          python3 -m http.server 8931 --directory dist --bind 127.0.0.1 &
          echo $! > /tmp/http-server.pid
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8931/checksums.txt >/dev/null 2>&1 && break
            sleep 0.5
          done

      # The real install.sh, unmodified, pointed at the local server instead of
      # GitHub via SLOPRAIL_RELEASE_URL — proving the SHIPPED script's
      # download → checksum verify → unpack → install sequence actually works,
      # not a rewritten stand-in.
      - name: run install.sh end to end
        run: |
          cp install.sh /tmp/install-under-test.sh
          chmod +x /tmp/install-under-test.sh
          # SLOPRAIL_INSTALL_TAG skips the real GitHub "latest" redirect
          # resolution — the local server above serves flat files with no
          # GitHub-shaped redirect to resolve, and a stranger's CI run has
          # no auth to reach a private repo's real release anyway. The value
          # is arbitrary; this test's mock doesn't care which tag it says.
          SLOPRAIL_RELEASE_URL="http://127.0.0.1:8931" SLOPRAIL_INSTALL_TAG="v0.0.0-ci-mock" SLOPRAIL_INSTALL_DIR="$RUNNER_TEMP/sloprail-installed" /tmp/install-under-test.sh

      - name: installed binaries actually run
        run: |
          "$RUNNER_TEMP/sloprail-installed/sr-session" start </dev/null >/dev/null
          echo "sr-session runs after install.sh"

      - name: tampered download is rejected
        run: |
          cp dist/sloprail-darwin-arm64.tar.gz /tmp/original.tar.gz
          printf 'corruption' >> dist/sloprail-darwin-arm64.tar.gz
          rm -rf "$RUNNER_TEMP/sloprail-tampered"
          if SLOPRAIL_RELEASE_URL="http://127.0.0.1:8931" SLOPRAIL_INSTALL_TAG="v0.0.0-ci-mock" SLOPRAIL_INSTALL_DIR="$RUNNER_TEMP/sloprail-tampered" /tmp/install-under-test.sh; then
            echo "install.sh accepted a tampered archive — checksum verification is broken"
            exit 1
          fi
          echo "tampered archive was correctly rejected"
          cp /tmp/original.tar.gz dist/sloprail-darwin-arm64.tar.gz

      - name: stop local server
        if: always()
        run: kill "$(cat /tmp/http-server.pid)" 2>/dev/null || true
