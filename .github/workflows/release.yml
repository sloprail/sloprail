# Builds the sr* binaries for every platform `make release` targets and
# attaches them to a GitHub Release, so install.sh has something to download.
#
# Triggered by a pushed tag matching v*, which is the ordinary way a maintainer
# marks a version — this workflow does not decide versions, it packages
# whatever commit was tagged. A tag push is also how a maintainer can dry-run
# a release build without publishing (delete the tag and the draft release
# after inspecting the artifacts).
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # git-cliff's --github-repo (below) looks up each commit's PR to attribute
  # it to an author (cliff.toml's `by @user` line) — a read of the PR list,
  # which contents: write alone does not grant. Missing this made every
  # release fail at "generate changelog" with a 403 from the GitHub API,
  # caught by actually cutting v0.2.1: the archives built and verified fine,
  # only the changelog step failed.
  pull-requests: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      # fetch-depth: 0 — git-cliff (below) needs the full commit history and
      # every tag to render a changelog; the default shallow clone (depth 1)
      # would leave it nothing to work with.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Catches "tagged without running `make bump-version` first" before any
      # binary is built — plugin.json/marketplace.json are lockstepped with
      # the repo's own release, bumped and committed to main BEFORE the tag
      # is cut (see scripts/bump-version.sh's own doc comment for the full
      # flow); a tag pushed without that commit would ship plugins claiming
      # a stale version.
      - name: verify plugin versions match this tag
        run: make verify-version TAG=${{ github.ref_name }}

      # macos-latest, not ubuntu, for the SAME reason distribute-local
      # re-signs every binary it copies: a darwin binary built without
      # `codesign` behind it is flagged by Gatekeeper on first run in a way
      # that reads like a corrupt download rather than an unsigned one. The
      # linux/* binaries cross-compile identically from either runner
      # (CGO_ENABLED=0), so building all four platforms here costs nothing
      # extra.
      - name: build release archives
        run: make release

      - name: release archives are what install.sh expects
        run: |
          test -f dist/sloprail-darwin-amd64.tar.gz
          test -f dist/sloprail-darwin-arm64.tar.gz
          test -f dist/sloprail-linux-amd64.tar.gz
          test -f dist/sloprail-linux-arm64.tar.gz
          test -f dist/checksums.txt
          # Each archive must unpack to the full service set in one directory —
          # the shape internal/subbin's sibling resolution requires.
          mkdir -p /tmp/verify
          tar -C /tmp/verify -xzf dist/sloprail-darwin-arm64.tar.gz
          for bin in sr sr-session sr-file sr-mark sr-agent sr-eval sr-checks sr-test; do
            test -x "/tmp/verify/sloprail-darwin-arm64/$bin" || { echo "missing or not executable: $bin"; exit 1; }
          done
          /tmp/verify/sloprail-darwin-arm64/sr-session start </dev/null >/dev/null
          echo "darwin-arm64 sr-session runs"

      # Notes for THIS tag alone (--latest), grouped by conventional-commit
      # type (feat/fix/docs/...) per cliff.toml — replaces GitHub's own
      # generate_release_notes (a flat PR list with no grouping).
      # --github-repo resolves each commit's PR author via the GitHub API
      # (cliff.toml's `commit.remote.username`, rendered as `` `by @user` ``)
      # — the action already forwards github.token as GITHUB_TOKEN, which
      # git-cliff reads on its own, so no separate token wiring is needed.
      - name: generate changelog
        uses: orhun/git-cliff-action@v4
        id: changelog
        with:
          config: cliff.toml
          args: --latest --strip header --github-repo ${{ github.repository }}
        env:
          OUTPUT: CHANGES.md

      - name: publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGES.md
          files: |
            dist/*.tar.gz
            dist/checksums.txt

      # The docs site (website repo) pins the exact sloprail commit it builds
      # docs from in docs-source.json (see that file's own $comment). A tagged
      # release is the signal that main has moved to a commit worth shipping,
      # so open a PR there bumping `ref` to this tag's commit — a human still
      # reviews and merges it (the docs review already happened on the sloprail
      # PR that landed this commit; this is only the "roll it out" step).
      # WEBSITE_DOCS_BUMP_TOKEN is a fine-grained PAT, repo secret ON THIS
      # (sloprail) repo — the default GITHUB_TOKEN here is scoped to this repo
      # alone and cannot push to or open a PR against a different one. Create
      # it at github.com/settings/personal-access-tokens (fine-grained, NOT a
      # classic token): Resource owner = sloprail org, Repository access =
      # Only select repositories -> sloprail/website, Permissions =
      # Contents: Read and write, Pull requests: Read and write. Add it here
      # as Settings -> Secrets and variables -> Actions -> New repository
      # secret, name WEBSITE_DOCS_BUMP_TOKEN. Mirrors website's own DOCS_TOKEN
      # (same fine-grained-PAT-as-repo-secret pattern, opposite direction and
      # read-only instead of read-write — see website's build.yml).
      - name: open a docs-ref bump PR against sloprail/website
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DOCS_BUMP_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WEBSITE_DOCS_BUMP_TOKEN is not set — skipping the website docs-ref bump PR. Bump docs-source.json's ref in sloprail/website by hand for this release." >&2
            exit 0
          fi

          sha="${{ github.sha }}"
          tag="${{ github.ref_name }}"
          branch="docs-ref-bump/$tag"

          work="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/sloprail/website.git" "$work"
          cd "$work"
          git checkout -b "$branch"

          jq --arg sha "$sha" '.ref = $sha' docs-source.json > docs-source.json.tmp
          mv docs-source.json.tmp docs-source.json

          if git diff --quiet -- docs-source.json; then
            echo "docs-source.json already pins $sha — nothing to open"
            exit 0
          fi

          git config user.name "sloprail-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add docs-source.json
          git commit -m "docs: bump ref to sloprail@${sha:0:12} ($tag)"
          git push origin "$branch"

          gh pr create \
            --repo sloprail/website \
            --title "docs: bump ref to sloprail@${sha:0:12} ($tag)" \
            --body "Rolls out the docs as of the $tag release (sloprail@$sha)." \
            --head "$branch" \
            --base main
