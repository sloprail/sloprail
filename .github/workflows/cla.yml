name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, reopened, synchronize]

# Explicit permissions in case the repository's default GITHUB_TOKEN
# permissions are read-only.
permissions:
  actions: write
  contents: write # needed to commit signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: "CLA Assistant"
        # Pinned to the immutable commit for tag v3.2.0 of iainmcgin/cla-github-action
        # (a maintained, Node-24 fork of the archived contributor-assistant/github-action;
        # see CONTRIBUTING.md for why). Re-pin deliberately when upgrading.
        uses: iainmcgin/cla-github-action@0d27e5a16278d4adb6b0c4b92f08ad27b0a21dc8 # v3.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: "https://github.com/sloprail/sloprail/blob/main/CLA.md"
          # Signatures live on a dedicated orphan-able branch, never on main,
          # so they can't be touched by normal branch protection/review rules
          # for source code and don't clutter the main branch's history.
          branch: "cla-signatures"
          path-to-signatures: "signatures/version1/cla.json"
          # Org owner(s) and common bots don't need to sign. noreply@anthropic.com
          # is the Co-Authored-By trailer an AI coding agent adds to a commit the
          # owner made with it — an unlinked email the action matches by address.
          allowlist: "n-sviridenko,noreply@anthropic.com,dependabot[bot],dependabot-preview[bot],renovate[bot],github-actions[bot],bot*"
          lock-pullrequest-aftermerge: true
          suggest-recheck: true
          # Default (true): fail if the PR opener isn't an author/co-author of
          # any commit in the PR — guards against attributing someone else's
          # signed commits to an unsigned opener.
          require-opener-as-author: true
