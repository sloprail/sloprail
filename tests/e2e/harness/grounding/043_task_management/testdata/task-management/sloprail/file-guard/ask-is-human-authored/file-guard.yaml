# A task's ASK.md is the human's ask, so every change to it must be grounded in
# the user's own words. The citation rides on the commit — a
# `Sloprail-Cites-User: <their exact words>` trailer — never inside the file,
# which keeps only the ask as derived text.
#
# This judges the committed changeset: the ASK.md files the range touched, with the
# quotes its commits cite (resolved against the transcripts, `changeset.citations`).
# The PREVENTION — refusing an ungrounded write before it lands — is the gate of the
# same name, on PreFileWrite (gate/ask-is-human-authored); a file-guard only judges
# what was committed.
#
# require: unconditional — ASK.md holds nothing but the ask, so there is no change
# to it that needs no grounding.
#
# The judge answers what existence cannot: does ASK.md say what the cited words
# say, and nothing else?
match: "**/tasks/*/*/ASK.md"
require:
  - citation: {source_types: [user]}
checks:
  - judge: ./reference-is-true-and-only-this.md.j2
