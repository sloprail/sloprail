# The "don't stop until target met" verdict lives here (a gate refuses; the
# context only tracks active/inactive).
#
# match skips this when no goal is active, so a goal-free Stop is permitted
# (`require` alone would block it). `require` orders the context's enter first,
# making the active read meaningful.
on:
  - event: Stop
    match: context["goal-tracking"].active
require:
  - context: goal-tracking
checks:
  - script: ./run-verify.sh
