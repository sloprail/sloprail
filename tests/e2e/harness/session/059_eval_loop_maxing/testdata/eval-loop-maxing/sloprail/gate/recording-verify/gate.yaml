# The "don't stop until every eval run is documented" verdict lives here (a
# gate refuses; the context only tracks active/inactive) — the same split
# goal-verify uses for the goal-tracking context.
#
# match skips this when no eval ran this session, so a recording-free Stop is
# permitted (`require` alone would block it). `require` orders the context's
# enter first, making the active read meaningful.
on:
  - event: Stop
    match: context["recording"].active
require:
  - context: recording
checks:
  - script: ./run-verify.sh
