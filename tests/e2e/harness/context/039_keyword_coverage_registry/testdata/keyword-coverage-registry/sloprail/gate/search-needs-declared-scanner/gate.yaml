# A GitHub search runs against a declared scanner: a `gh` call that searches
# GitHub (or that this rule cannot see into) is refused until a scanner has been
# declared this session — scanners/<name>/scanner.yaml naming the keywords the
# search must cover. Without it, verify-scanner-coverage has nothing to hold the
# search to (it runs at Stop, and only once a scanner is declared), so research
# done before any declaration escapes the registry entirely.
#
# Why the check reads scanner-declared's REGISTRY rather than a `require:
# context` or `context[...].active` in the match:
#   - activity is per cycle: the context's exit closes it at every Stop once
#     coverage passed, so in a second turn a scanner declared in the first would
#     read as undeclared;
#   - the registry (sr-session state, per session) is what the context logs a
#     scanner into — at the PreFileWrite of its scanner.yaml, so a search later
#     in the same turn finds it — and it is never shrunk (only a delete the
#     user asked for retires a scanner).
# `require: context` would also refuse with the engine's generic wording, which
# names no remedy; the script says what to write.
#
# The match takes EVERY gh invocation, and every line that merely NAMES gh, and
# the check decides which of them search (see needs-declared-scanner.sh): the
# search entry points — `gh search`, `gh api` search endpoints and graphql
# (resolved, so `repos/../search/…` is one), `list --search/-S` — plus what it
# cannot see into: an alias or extension, and a gh the parser did not find as an
# invocation (`eval "gh search …"`, `python3 -c "os.system('gh search …')"`).
# Everything else gh does runs with or without a scanner.
#
# Two earlier versions were each wrong one way. A list of search spellings was
# measured short (`gh issue list --search`, `search (` with a space, an alias,
# `X=search; gh $X …` all searched with no scanner); an allowlist of reads
# refused ordinary calls (`gh pr create`, `gh repo clone`, `gh pr checks`) and
# called them searches.
#
# Decided on the parsed invocations first, so `cd x && gh …`, `FOO=1 gh …`,
# `env …`, `command gh …`, `bash -c "gh …"` and quoted arguments are all the
# same `gh` invocation. A program named by a variable (`$GH search`) is not
# visible at all — see the README's "What it does not catch".
on:
  - event: PreCommandInvoke
    match: >-
      any(event.invocations, .bin == "gh") or
      event.raw matches "(^|[^A-Za-z0-9_./-]|\\\\[a-z])gh([^A-Za-z0-9_.-]|$)"
checks:
  - script: ./needs-declared-scanner.sh
