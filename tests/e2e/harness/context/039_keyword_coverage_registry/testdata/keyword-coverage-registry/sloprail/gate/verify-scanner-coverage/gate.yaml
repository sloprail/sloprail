# Owns "did a search cover the declared keywords", checked against what
# scanner-declared logged (not derived from the searches themselves, else a
# search that never ran could not be caught missing).
#
# match skips this when no scanner was declared; `require` orders the context's
# enter first, making the active read meaningful.
#
# Deliberately a script, not a judge: this is a REGISTRY check — the scanner
# declares its own keywords, so requiring a search for those literal words
# (case-insensitive, whole-word) is the check's actual contract, not a
# paraphrase of them. A bare substring match (an earlier version of this
# script) was measured to be wrong in both directions — it credited "art"
# merely appearing inside "Kubernetes-agnostic-architecture", and it was
# case-sensitive so "Guardrail" in a call failed a declared "guardrail"
# keyword — but the fix for THAT is word-boundary, case-insensitive
# matching (grep -iw), which is still a structural fact a script decides
# correctly; it does not require handing "did this call address the topic"
# to a judge, which would trade the check's whole point — free, instant,
# reproducible — for a property (crediting a synonym) this check does not
# promise.
on:
  - event: Stop
    match: context["scanner-declared"].active
require:
  - context: scanner-declared
checks:
  - script: ./verify-coverage.sh
