# Wakes on either a #update/#decision/#skip tag or a file touch under the
# artifact paths. Each occurrence logs what showed up into the registry
# (sr-session state), so the paired Stop gate can read back which tag was
# declared and which artifacts landed — even across separate tool calls.
on:
  - event: PostTagWrite
    match: any(event.tags, .label == "update" or .label == "decision" or .label == "skip")
  - event: PostFileCreate
    match: event.path startsWith "memories/updates/" or event.path startsWith "memories/decisions/"
  - event: PostFileUpdate
    match: event.path startsWith "memories/updates/" or event.path startsWith "memories/decisions/"
enter: ./enter.sh
exit: ./exit.sh
