# GATE half of the old preventive file-guard of the same name: a write under
# examples/ is refused until document-example and run-eval were both loaded this
# session — a shipped guardrail sample has several pieces that must stay in sync
# (config, README, e2e test, eval fixture; see
# .claude/skills/document-example/SKILL.md), and nothing about a single file edit
# makes that obvious without having read the skill first. The sibling file-guard
# (.sloprail/file-guard/require-examples-skills/) is the Stop backstop.
#
# run-eval is required alongside document-example, not left to be discovered from
# document-example's own link to it, because a write under examples/*/eval/
# specifically needs run-eval's fixture.yaml/scoring/verification detail
# immediately. The decision is path + require only: it reads no content, so it
# needs no resultKnown check.
on:
  - event: PreFileWrite
    match: 'event.path startsWith "examples/"'
require:
  - skill: document-example
  - skill: run-eval
