# The PREVENTION half of skill-quality: a write of a SKILL.md whose bytes exceed the size
# cap is refused before it lands. ONLY the deterministic cap lives here — the quality
# judgement stays in the plain file-guard of the same name (.sloprail/file-guard/skill-quality/),
# which judges the committed changeset at Stop; a judge never runs in a gate. The cap
# itself is the one library both share (size-cap-lib.sh, in the rule-quality file-guard folder).
on:
  - event: PreFileWrite
    match: 'event.path endsWith "SKILL.md"'
checks:
  - script: ./check.sh
