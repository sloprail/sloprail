# The rules must themselves be high-signal — judges ONE RULE.md against a rubric
# whose meta-rules are LOADED from this guard's rules/ directory (one meta-rule
# per rules/<name>/RULE.md) as an array, and rendered into the frame the judge
# template holds. Adding a meta-rule is adding a directory; no prompt is edited
# (the template iterates whatever array prepare emits).
#
# A JUDGE check now, migrated from the old hand-rolled SCRIPT check that called
# `claude` itself. The reviewer asked for this: the engine, via sr-agent, owns
# the model, the timeout, the isolation settings and the verdict shape — a judge:
# check no longer hand-rolls any of that. What is genuinely this guard's — the
# enforced-only meta-rule selection — lives in prepare.sh, which emits the
# meta-rules as additionalContext.meta_rules (an array of {name, body}); the
# judge template holds the rubric frame and renders that array with a {% for %}
# loop, against the file's own content (event.newContent, read flat off the
# event). There is no RUBRIC.md and no splice marker: the frame is in the template
# where it is visible and versioned, and the rules are structured data.
#
# FAIL-OPEN RECONCILIATION (flagged, not hidden). The old script failed OPEN —
# permitted, unjudged — when its OWN machinery failed (no claude, a timeout, an
# unparseable verdict). A judge: check cannot reproduce that: the model call is
# now the engine's, and the engine's judge path fails CLOSED on machinery failure
# by deliberate design (internal/dispatch/judge.go). So those cases now REFUSE
# rather than permit. The rule-loading fail-open (a missing rules/ dir, an
# unreadable rule) likewise becomes a refusal in prepare.sh — the guard's own
# committed files, so refusing loudly is the safe direction. See prepare.sh's
# header for the full reconciliation. EMPTY rules/ is still a refusal (the
# deliberate asymmetry), preserved exactly.
#
# match: every RULE.md in the repo, path-anchored on the file's own name. A
# file-guard matches a FILE'S STATE (FileMatchScope: flat `path`, `markers`,
# `context`), so the expression reads `path`, NOT `event.path`. No directory
# prefix, so a rule written anywhere is caught, not only the ones under a guard's
# rules/ today — a prefix matcher would go stale, silently, the first time a
# guardrail is added somewhere new.
match: path endsWith "RULE.md"

# preventive: true reproduces the old Pre+Post binding exactly. A preventive
# file-guard fires on the PRE write to REFUSE a bloated RULE.md before it lands,
# AND, like every guard, fires the after-check at Stop on the SETTLED file. The
# Post after-check is the backstop no unusual writer slips past: a command/sed/git
# edit whose result the engine cannot derive is failed CLOSED at Pre by the engine
# (services/sr-session/nature_fileguard.go isUnderivablePreWrite) and the settled
# file is judged at Stop — where event.newContent carries the settled bytes off
# the tree diff, which the template reads the same way. Dropping preventive would
# lose the Pre-prevention the old rule was built around.
preventive: true

checks:
  # prepare loads the meta-rules; the judge renders them against the file and asks
  # the model for a verdict. model is size-md — the engine's default judge
  # modelset, so the tier is the engine's to choose (the old script pinned
  # claude-haiku-4-5-20251001 directly).
  #
  # allowed_tools: [Read] is ADDITIVE, and no longer what lets the judge read
  # the project: the engine passes the workspace to sr-agent as
  # `--add-dir:readonly`, where Read/Grep/Glob need no grant. What [Read] adds
  # is reads OUTSIDE the project (any path on disk). The verdict file is always
  # writable regardless of this list — sr-agent grants an Edit rule scoped to
  # the answer file's own folder (services/sr-agent/harness.go
  # claudeCodeSpec.grant), never an unscoped Write — and the project stays
  # denied to every file-writing tool. The exact grant (the answer folder's Edit
  # rule(s) plus Read, nothing else) is pinned end-to-end by
  # TestJudgeReadsTheWorkspaceButCannotWriteIt in tests/e2e/engine_repo_judges/.
  # No explicit timeout: runs under the engine's own default
  # (internal/dispatch/exec.go's defaultCheckTimeout), so this tracks that
  # value rather than needing to be kept in sync with it by hand.
  - prepare: ./prepare.sh
    judge: ./judge-rule.md.j2
    model: size-md
    allowed_tools: [Read]
