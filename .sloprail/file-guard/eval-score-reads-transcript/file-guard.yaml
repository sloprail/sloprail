# An eval fixture's score.sh must actually inspect what the agent-under-test
# did, not just return a verdict. sr-eval's own run.go already refuses to SCORE
# a run with no transcript at all (a Go-level, non-sloprail check); this guards
# the other half — a scorer whose EXIT CODE does not genuinely depend on the
# transcript's content is indistinguishable from a fixed `exit 0`/`exit 1`,
# and would report every run the same way regardless of what the guardrail
# under test actually did. This file-guard judges the settled scorer (`sr-checks run` judges, Stop verifies), so
# it is caught before a run silently "passes" against nothing. There is no gate for
# it: a data-flow question is a judge's, and a judge runs only in a file-guard.
match: path matches "^examples/.+/eval/.+/score\\.sh$"
checks:
  # "Does the transcript's value ever reach a decision" is a data-flow
  # question, not a structural fact — grepping for the literal string
  # SR_EVAL_TRANSCRIPT anywhere in the file passes a script that reads it
  # into a variable and never consults it, the same shape as any other
  # keyword-proxy-for-meaning mistake. Hand it to a judge instead.
  # No explicit timeout: runs under the engine's own default
  # (internal/dispatch/exec.go's defaultCheckTimeout), so this tracks that
  # value rather than needing to be kept in sync with it by hand.
  - judge: ./judge.md.j2
    model: size-md
