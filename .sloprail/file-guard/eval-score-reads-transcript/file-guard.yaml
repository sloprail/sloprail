# An eval fixture's score.sh must actually inspect what the agent-under-test
# did, not just return a verdict. sr-eval's own run.go already refuses to SCORE
# a run with no transcript at all (a Go-level, non-sloprail check); this guards
# the other half — a scorer that DOES run but never reads SR_EVAL_TRANSCRIPT is
# indistinguishable from `exit 0` unconditionally, and would report every run a
# pass regardless of what the guardrail under test actually did. preventive:
# catch this while the fixture is being written, not after a run silently
# "passes" against nothing.
match: path matches "^examples/.+/eval/.+/score\\.sh$"
preventive: true
checks:
  - script: ./reads-transcript.sh
