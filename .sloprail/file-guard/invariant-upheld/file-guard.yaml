# A file-guard's scope exposes the file's markers as a LIST (`markers`), so a
# marker test is a quantifier over it — `any(markers, .kind == "invariant")` —
# not a singular `marker.kind`.
#
# The marked code still upholds its invariant [judge], one subject per invariant whose spec file
# or marked code changed (subjects.sh). Copied from examples/business-invariants pinned-invariant;
# the marker names a spec/<domain>/invariants/<id>.yaml instead of a pinned spec line, so there is
# no pin to check. A deleted file holds no code to judge: a marker leaving is invariant-covered's.
# Not in examples/: each example carries its own pinned-link markers.
#
# Not in agent-config docs (.claude/{skills,commands,agents}/**.md): a skill's SKILL.md documents the marker with a placeholder
# (`// sr:invariant "<the rule>"`), and the scanner reads a marker anywhere in a
# file's text, so that example would pose as a real pin. These rules are about
# code; a doc is not code. Narrowing by path loosens nothing in real
# code, where skipping `<...>` fqns would also skip a genuine pin whose text opens
# with "<" (a rule like "<5 days").
match: >-
  path matches "^spec/[a-z0-9-]+/invariants/[a-z0-9-]+[.]yaml$"
  or (any(markers, .kind == "invariant") and not path startsWith "examples/"
  and not (path endsWith ".md" and (path startsWith ".claude/skills/" or path startsWith ".claude/commands/" or path startsWith ".claude/agents/")))
subjects: ./subjects.sh
checks:
  # prepare reads the subject invariant's predicate and hands it to the judge with the
  # marked files' diffs, so the judge rules on it without reading anything: it runs with
  # this folder as its working directory, and a spec outside it is a permission denial away.
  - prepare: ./invariant-text.sh
    judge: ./code-upholds-invariant.md.j2
