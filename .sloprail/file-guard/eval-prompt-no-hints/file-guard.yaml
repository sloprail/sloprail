# An eval fixture's prompt.md must not name — or paraphrase — the very thing
# it exists to test. sr-eval proves a guardrail changes a REAL agent's
# behavior; a prompt that reveals the required skill, the gate, or the
# .sloprail/ machinery hands the agent the answer instead of letting the
# guardrail supply it, and a pass then proves nothing. This file-guard judges the
# settled prompt at Stop. There is no gate for it: the question is one of meaning,
# and a judge runs only in a file-guard, never before the write.
match: path matches "^examples/.+/eval/.+/prompt\\.md$"
checks:
  # "Does this prompt reveal — literally or by paraphrase — the guardrail it
  # exists to test" is a question about MEANING, not a structural fact a
  # script can read off. An earlier version of this rule was a literal-name
  # grep, which only ever caught the exact directory name and was silently
  # defeated by any rewording — a script pretending to decide a question
  # that needed judgement. judge-checks.md's own "is this the right
  # instrument" test says this belongs to a judge; prepare.sh hands it the
  # fixture's own rule/skill bodies so it can recognize a paraphrase, not
  # just a literal match.
  # No explicit timeout: runs under the engine's own default
  # (internal/dispatch/exec.go's defaultCheckTimeout), so this tracks that
  # value rather than needing to be kept in sync with it by hand.
  - prepare: ./prepare.sh
    judge: ./judge.md.j2
    model: size-md
