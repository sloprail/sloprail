# A change to a skill shipped in the sloprail plugin is a good change: not fitted to one incident,
# losing nothing the reader needs, regressing nothing. Judged per skill, on its diff alone: a
# commit does not have to cite anyone's words for it. Whether the skill as it stands is good is
# plugin-skill-content's question, not this one's.
match: path startsWith "marketplace/plugins/sloprail/skills/"
deletions: include
subjects: ./subjects.sh
checks:
  - prepare: ./prepare.sh
    judge: ./judge-change.md.j2
    model: size-md
    allowed_tools: [Read]
